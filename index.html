<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多益衝刺">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>多益衝刺計畫</title>
<meta name="theme-color" content="#0E6B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄手機 app，答案卡劃記為視覺母題；底部分頁導覽 */
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#1D2330; --muted:#5D6676; --line:#D6DCE4;
  --accent:#0E6B66; --accent-soft:#DDEFEC; --pencil:#2B2F38;
  --L:#3456A0; --R:#0E6B66; --V:#8A5A1E; --M:#A23838; --ok:#2E7D4F;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141A; --card:#1A1E26; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2A303B;
  --accent:#4DB6AC; --accent-soft:#163330; --pencil:#D9DDE4;
  --L:#8EA9E6; --R:#4DB6AC; --V:#D6A764; --M:#E68A8A; --ok:#6CC592; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141A; --card:#1A1E26; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2A303B;
  --accent:#4DB6AC; --accent-soft:#163330; --pencil:#D9DDE4;
  --L:#8EA9E6; --R:#4DB6AC; --V:#D6A764; --M:#E68A8A; --ok:#6CC592; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-family:var(--mono);font-size:56px;line-height:1;font-weight:600;color:var(--accent);letter-spacing:-.02em}
.count span{font-size:15px;color:var(--muted)}
.goal{text-align:right;font-size:13px;color:var(--muted)}
.goal .mono{color:var(--ink);font-size:15px}

section{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:max-content}

/* day nav */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar h2{font-size:20px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.navbtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);cursor:pointer;font:inherit}
.wd small{font-size:11px;color:var(--muted)}
.wd .n{font-family:var(--mono);font-size:14px}
.wd .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.wd .dot.half{background:linear-gradient(90deg,var(--pencil) 50%,transparent 50%)}
.wd .dot.full{background:var(--pencil);border-color:var(--pencil)}
.wd.off .n{color:var(--accent)}
.wd.sel{border-color:var(--accent);background:var(--card)}
.wd.exam .n{color:var(--M);font-weight:600}

/* tasks */
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tasks{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.task:first-child{border-top:0}
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:1px;transition:background .15s}
.task.done .bub{background:var(--pencil);border-color:var(--pencil);color:transparent}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:500;min-width:0}
.td{font-size:13px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;margin-right:6px}
.tag.L{color:var(--L)}.tag.R{color:var(--R)}.tag.V{color:var(--V)}.tag.M{color:var(--M)}
.min{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* plan */
.wk{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.wk h3{font-size:16px;display:flex;justify-content:space-between;gap:8px}
.wk p{margin:0;font-size:13px;color:var(--muted)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.row:first-child{border-top:0}
.row .d{font-family:var(--mono);font-size:13px}
.row .d small{display:block;font-family:var(--sans);color:var(--muted);font-size:11px}
.row .s{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.today{background:var(--accent-soft)}
.row .st{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .st.ok{color:var(--ok)}

/* scores */
form.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.full{grid-column:1/-1}
.btn{font:inherit;font-weight:500;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow .tot{font-family:var(--mono);font-weight:600}
.del{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}

/* settings */
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{font:inherit;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.days7 button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{color:var(--accent)}
/* practice */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-width:0}
.mode b{font-size:16px}
.mode span{font-size:12px;color:var(--muted)}
.mode .big{font-family:var(--mono);font-size:22px;color:var(--accent);font-weight:600}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding-block:10px;z-index:3;border-bottom:1px solid var(--line)}
.timer{font-family:var(--mono);font-size:20px;font-weight:600}
.timer.over{color:var(--M)}
.qtext{font-size:17px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt .bub{margin:0}
.opt.pick{border-color:var(--pencil)}
.opt.pick .bub{background:var(--pencil);border-color:var(--pencil);color:var(--card)}
.opt.right{border-color:var(--ok)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--M)}
.opt.wrong .bub{background:var(--M);border-color:var(--M);color:var(--card)}
.passage{white-space:pre-wrap;font-size:15px;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:Georgia,"Noto Serif TC",serif}
.qblock{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.qblock h4{margin:0;font-size:15px;font-weight:500}
.exp{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--accent-soft);border-radius:10px}
.result{display:flex;align-items:baseline;gap:10px}
.result b{font-family:var(--mono);font-size:44px;color:var(--accent)}
.rv{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.rv .s{font-size:15px}
.rv .a{font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--M)}
.card{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;cursor:pointer;text-align:center}
.card .w{font-size:30px;font-weight:600;font-family:Georgia,serif;word-break:break-word}
.card .m{font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{font:inherit;font-size:12px;font-weight:500;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:2px 10px;margin-top:6px;cursor:pointer}
.plist{display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">距離 <span id="examLbl"></span> 多益</div>
      <div class="count"><b id="cd">0</b><span>天</span></div>
    </div>
    <div class="goal">目標 <span class="mono" id="goalT">800</span><br>最近 <span class="mono" id="latest">675</span><br><span id="gap"></span></div>
  </header>
  <main id="view"></main>
</div>

<nav><div class="in">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>今天</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>計畫</button>
  <button data-tab="prac"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>練習</button>
  <button data-tab="score"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>成績</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
</div></nav>

<script>
// 原創多益練習題庫。每題正解寫在選項第一個，程式執行時會打亂順序。
window.BANK = {
p5: [
["The new software will help employees ___ their tasks more efficiently.","complete|completion|completely|completed","詞性","help + 受詞 + 原形動詞，空格要動詞原形。"],
["Ms. Lin has been ___ to the position of regional manager.","promoted|promotion|promoting|promote","被動","has been + p.p. 是現在完成被動，「被升職」。"],
["All visitors must sign in at the front desk ___ entering the laboratory.","before|during|until|since","介係詞","進實驗室「之前」簽到，before + Ving。"],
["The quarterly report was ___ thorough that the board approved it without changes.","so|such|too|very","句型","so + 形容詞 + that…，「如此…以致於」。such 後面接名詞。"],
["Please submit your expense reports ___ Friday at 5 P.M.","by|until|in|at","介係詞","截止期限用 by；until 表示持續到某時。"],
["Our customer service team ___ responds to inquiries within 24 hours.","typically|typical|typify|typicality","詞性","修飾動詞 responds 要用副詞。"],
["The conference room on the third floor is currently ___ renovation.","under|over|below|among","介係詞","under renovation 是固定用法，「整修中」。"],
["Mr. Chen asked his assistant to reschedule the meeting because ___ was traveling.","he|him|his|himself","代名詞","子句主詞位置用主格 he。"],
["The company's profits increased ___ 15 percent last quarter.","by|at|with|for","介係詞","增加「了」多少幅度用 by。"],
["Applicants ___ résumés are incomplete will not be considered.","whose|who|whom|which","關係詞","空格後直接接名詞 résumés，表所有格用 whose。"],
["Neither the manager ___ her assistant was available for comment.","nor|or|and|but","連接詞","neither A nor B 固定搭配。"],
["The shipment is expected to arrive ___ two to three business days.","within|among|between|along","介係詞","within + 時間，「在…之內」。"],
["Ms. Park is the ___ qualified of all the candidates.","most|more|much|many","比較級","the ___ of all 是最高級。"],
["The hotel offers free shuttle service to the airport for all ___ guests.","registered|registering|registers|registration","詞性","修飾 guests，「已登記的」客人用過去分詞。"],
["If the weather ___ good tomorrow, the outdoor event will proceed as planned.","is|will be|was|being","時態","條件句 if 子句用現在式代替未來。"],
["The manager suggested ___ the launch date until the testing is complete.","postponing|to postpone|postpone|postponed","動名詞","suggest + Ving。"],
["We are pleased to announce that our new branch ___ next month.","will open|opened|has opened|opening","時態","next month 是未來時間。"],
["Employees are reminded to turn off all equipment at the end of ___ shift.","their|them|they|theirs","代名詞","名詞 shift 前用所有格 their。"],
["The budget proposal must be approved by the finance department ___ it can be implemented.","before|unless|although|whereas","連接詞","先核准「之後才能」執行，用 before。"],
["Despite the heavy rain, attendance at the trade fair was ___ high.","surprisingly|surprising|surprise|surprised","詞性","修飾形容詞 high 要用副詞。"],
["Tickets for the concert can be purchased online ___ at the box office.","or|nor|so|yet","連接詞","兩個購票管道二選一用 or。"],
["The CEO will deliver a speech ___ the company's 50th anniversary celebration.","at|on|to|by","介係詞","在某場活動上用 at。"],
["Please refer to the attached document for ___ information about the project.","additional|addition|additionally|add","詞性","修飾名詞 information 要用形容詞。"],
["The marketing team has ___ completed the first phase of the campaign.","already|yet|still|ever","副詞","肯定句的現在完成式表「已經」用 already；yet 用於否定或疑問。"],
["Ms. Wong prefers to handle client complaints ___ rather than delegating them.","herself|she|her|hers","代名詞","強調「親自」處理用反身代名詞。"],
["The factory has reduced its energy consumption ___ installing solar panels.","by|for|with|from","介係詞","by + Ving 表「藉由…方式」。"],
["Only employees with security clearance are ___ to enter the server room.","permitted|permission|permitting|permit","被動","be permitted to V，「被允許」。"],
["The new policy will take ___ on January 1.","effect|affect|effective|effectively","字彙","take effect 是固定用法，「生效」。"],
["The seminar has been rescheduled ___ low registration numbers.","due to|because|although|so that","介係詞","空格後是名詞片語，用介係詞 due to；because 後要接子句。"],
["We need to hire someone ___ can speak both English and Japanese.","who|whom|whose|which","關係詞","先行詞是人，關代在子句當主詞用 who。"],
["The contract will expire at the end of the month ___ it is renewed.","unless|if|because|once","連接詞","「除非」續約，否則到期。"],
["Sales of the new model have exceeded ___ expectations.","all|every|each|much","限定詞","複數名詞 expectations 前用 all；every、each 接單數。"],
["The report needs to be ___ before it is sent to the client.","revised|revising|revise|revision","被動","to be + p.p.，報告「被修改」。"],
["Mr. Tanaka has worked for the firm ___ 2015.","since|for|from|during","介係詞","現在完成式 + 時間起點用 since。"],
["The restaurant is known for its ___ service and reasonable prices.","attentive|attention|attend|attentively","詞性","修飾名詞 service 要用形容詞。"],
["Participants should bring a photo ID ___ proof of registration.","as well as|as long as|as soon as|as far as","連接詞","as well as 表「以及」，連接兩個名詞。"],
["The renovation project was completed ahead of ___.","schedule|scheduled|scheduling|schedules","字彙","ahead of schedule 固定用法，「提前」。"],
["Customers who wish to return items must present the original ___.","receipt|recipe|reception|recipient","字彙","退貨要出示收據 receipt。"],
["Our sales figures this year are significantly higher ___ last year's.","than|then|as|from","比較級","比較級 higher + than。"],
["The director was impressed by the ___ of the proposal.","clarity|clear|clearly|clarify","詞性","the ___ of 中間要名詞。"],
["Please make sure that all documents are signed ___ submitting them.","before|prior|until|ago","介係詞","prior 要搭配 to；before + Ving 才完整。"],
["The company is seeking a ___ engineer with at least five years of experience.","qualified|qualify|qualification|qualifying","詞性","修飾 engineer，「有資格的」用 qualified。"],
["Each of the departments ___ required to submit a budget plan.","is|are|be|being","主詞動詞一致","Each of + 複數名詞，動詞用單數。"],
["The new branch manager has made several ___ to the workflow.","improvements|improve|improved|improving","詞性","several 後面接複數名詞。"],
["The client requested that the delivery date ___ moved forward.","be|is|was|will be","假設語氣","request that + 主詞 + (should) 原形動詞。"],
["Mr. Lopez will be out of the office ___ next Wednesday.","until|by|since|within","介係詞","不在辦公室的狀態持續「直到」下週三。"],
["Our online store allows customers to track ___ orders in real time.","their|there|they're|them","代名詞","名詞 orders 前用所有格 their。"],
["The board of directors ___ the merger proposal at yesterday's meeting.","approved|approves|will approve|approving","時態","yesterday 用過去式。"],
["The museum is open to the public every day ___ Mondays.","except|besides|without|beyond","介係詞","「除了週一以外」都開，用 except。besides 是「除此之外還有」。"],
["Ms. Kim was ___ for her outstanding contribution to the project.","recognized|recognition|recognize|recognizable","被動","was + p.p.，「被表揚」。"],
["Please contact the IT department ___ you experience any technical problems.","if|unless|whether|so","連接詞","「如果」遇到問題就聯絡。"],
["The new office building is ___ located near the subway station.","conveniently|convenient|convenience|convene","詞性","修飾過去分詞 located 用副詞。"],
["The proposal was rejected because it was not cost-___.","effective|effect|effectively|efficiency","字彙","cost-effective，「划算的」。"],

{t:"Article",title:"Local bakery expands",text:"Local Bakery Expands Overseas\n\nTAICHUNG — Sunrise Bakery, famous for its pineapple cakes, announced on Monday that it will open its first overseas store in Singapore this September. Founded in 1998 by Lee Mei-hua as a small family shop, the bakery now operates twelve locations across Taiwan.\n\n\"Many tourists bring our cakes home as gifts, and we kept receiving requests from customers abroad,\" said Ms. Lee's son, Andrew Lee, who became the company's president in 2020. Under his leadership, the company launched an online store that now accounts for nearly 30 percent of total sales.\n\nThe Singapore store will be located in a busy shopping district and will offer the same products as the Taiwanese locations. The company plans to hire about 15 local staff. If the store succeeds, Sunrise Bakery hopes to enter the Japanese market within three years.",
q:[["What is the article mainly about?","A company's plan to open a store abroad|The history of pineapple cakes|A new online shopping service|A bakery's change of ownership","標題與第一段：要在新加坡開第一家海外店。"],

{t:"Job ad + E-mail",title:"Customer support job",text:"[Passage 1]\nPosition: Bilingual Customer Support Specialist — Nova Travel\n\nNova Travel is looking for a customer support specialist to assist travelers by phone and e-mail. Requirements: fluency in English and Mandarin; at least two years of customer service experience; ability to work weekend shifts. Experience in the travel industry is preferred but not required. To apply, send your résumé and a short cover letter to hr@novatravel.tw by July 15.\n\n[Passage 2]\nTo: hr@novatravel.tw\nFrom: Jason Wu\nDate: July 10\nSubject: Customer Support Specialist\n\nDear Hiring Manager,\n\nI am writing to apply for the customer support position advertised on your Web site. I have worked for three years at the front desk of a hotel in Kaohsiung, where I handled guest requests in both English and Mandarin. Although I have not worked at a travel agency, I am familiar with booking systems and enjoy helping travelers.\n\nI am available to work any day of the week. My résumé is attached.\n\nSincerely,\nJason Wu",

 {n:'考前收斂',g:'不學新東西，只看錯題本、維持手感，調整作息。'}
];
const isOff=d=>S.off.includes(pd(d).getDay());
function phaseOf(d){
  const toExam=diff(d,S.exam);
  if(toExam<=6)return 5;
  return Math.max(0,Math.min(4,Math.floor(diff(S.start,d)/7)));
}
function offRank(d){ // 這是本週區塊中的第幾個休假日（0 起算）
  const w=Math.floor(diff(S.start,d)/7),bs=add(pd(S.start),w*7);let r=0;
  for(let i=0;i<7;i++){const x=ymd(add(bs,i));if(x===d)return r;if(isOff(x))r++}
  return r;
}
const T=(tag,t,m,d,fixed)=>({tag,t,m,d,fixed});
const vocab=(m=20)=>T('V','單字',m,'《怪物講師 單字+文法》往下推 1 單元，並複習前兩天的字');

function tasksFor(d){
  const toExam=diff(d,S.exam);
  if(toExam===0)return{type:'考試日',list:[T('M','考試',0,'帶身分證正本與准考證，提早 30 分鐘到考場。閱讀照練習的分配：Part 5 九分鐘、Part 6 八分鐘、其餘全給 Part 7。',true)]};
  if(toExam<0||diff(S.start,d)<0)return null;
  const off=isOff(d),p=phaseOf(d);let L=[];
  if(toExam===1){
    return{type:'休息日',list:[T('R','錯題本',30,'只翻錯題本與 Part 5 文法筆記，不做新題'),T('M','準備',10,'確認考場、交通、身分證、准考證、2B 鉛筆與橡皮擦',true),T('M','早睡',0,'今晚不熬夜，明天腦袋清醒比多讀一小時有用',true)]};
  }
  if(off){
    const r=offRank(d),w=Math.floor(diff(S.start,d)/7);
    if(p===5){
      L=[T('M','閱讀計時重做',75,'拿第 1 回模考的閱讀重做一次，照正式 75 分鐘計時',true),T('R','對答與訂正',45,'錯題寫進錯題本，標出是時間不夠還是看不懂'),vocab(20),T('L','聽力暖身',30,'把模考 Part 3/4 錯題音檔再聽一次')];
    }else if(r===0){
      const n=Math.min(w+1,5);
      L=[T('M',`第 ${n} 回全真模考`,120,'《神猜解 5 回全真模擬試題》。聽力 45 分＋閱讀 75 分一次做完不暫停。閱讀分配：Part 5 九分鐘、Part 6 八分鐘、剩下 58 分鐘給 Part 7',true),
         T('M','對答、記成績',20,'把聽力與閱讀分數記到「成績」頁'),
         T('R','整理錯題',60,'錯題分三類：單字不認識、文法、時間不夠沒做到'),vocab(20)];
    }else{
      L=[vocab(20),T('R','模考錯題重做',60,'昨天的錯題蓋住答案再做一次，說得出理由才算懂'),
         T('R','Part 7 多篇限時',45,'《神猜解多益閱讀》雙篇或三篇 2 組，每組照題數 × 1 分鐘計時'),
         T('L','聽力精聽',45,'模考 Part 3/4 錯的那幾段逐句聽寫，再跟讀 3 遍'),
         p<=2?T('R',p===2?'《多益解密》':'《怪物講師多益速解》',40,p===2?'讀 2 節，把出題邏輯抄進筆記':'讀 2 章，目標本週讀完'):T('R','Part 5 文法弱點',40,'挑錯最多的文法類型，回《單字+文法》對應章節複習')];
    }
  }else{
    const dow=pd(d).getDay();
    if(p===0)L=[vocab(),T('R','《怪物講師多益速解》',40,'讀 1 章（目前 52%），本週讀完'),T('R','Part 5 限時',15,'30 題限時 9 分鐘，對答後抄錯題'),T('L','Part 2',15,'1 回 25 題，錯的重聽到聽懂為止')];
    else if(p===1)L=[vocab(),T('R','Part 5 限時',15,'30 題 9 分鐘，速度比上週快才算過關'),T('R','Part 7 單篇計時',40,'《神猜解多益閱讀》單篇 5 篇，每篇限時「題數 × 1 分鐘」，超時就先猜下一題'),T('R','找原文定位',15,'每題錯的都要在文章裡畫出答案根據的那一句')];
    else if(p===2)L=[vocab(),T('L','Part 3/4 預讀',35,'各 1 組：音檔播指示語時先掃題目與選項，聽完後錯題聽寫'),T('R','《多益解密》',20,'讀 1 節（目前 49%）'),T('R','Part 5 限時',15,'30 題 9 分鐘')];
    else if(p<=4){
      L=dow%2?[vocab(),T('R','Part 5+6 限時',20,'46 題限時 17 分鐘，這是正式考試的時間'),T('R','Part 7 多篇',35,'雙篇或三篇 2 組，計時'),T('R','錯題本',15,'把今天的錯題寫進去')]
             :[vocab(),T('L','Part 3/4',30,'各 1 組，先預讀題目再聽'),T('R','Part 7 單篇',25,'3 篇計時'),T('R','錯題本',15,'翻上週的錯題，能直接說出答案才打勾')];
    }else L=[vocab(15),T('R','錯題本',30,'只看錯題，不做新題'),T('L','跟讀',15,'模考 Part 3/4 挑一段跟讀')];
  }
  const budget=off?S.offMin:S.workMin,base=off?240:90;
  const fixedSum=L.filter(x=>x.fixed).reduce((a,x)=>a+x.m,0);
  const flexSum=L.filter(x=>!x.fixed).reduce((a,x)=>a+x.m,0);
  const f=flexSum?Math.max(.3,(budget-(off?fixedSum:0))/(base-(off?fixedSum:0))):1;
  L=L.map(x=>x.fixed||!x.m?x:Object.assign({},x,{m:Math.max(5,Math.round(x.m*f/5)*5)}));
  return{type:off?'休假日':'上班日',list:L};
}

const B=window.BANK||{p5:[],p7:[],vocab:''};
const VOC=B.vocab.split(';').map(s=>{const[w,m]=s.split('|');return{w,m}});
let WRONG=store.get('wrong',{p5:[],p7:[]});
let P5LOG=store.get('p5log',[]);
let P7DONE=store.get('p7done',{});
let VLV=store.get('vocab',{});
let Q=null,timerId=null;
const LET='ABCD';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mkOpts=s=>{const o=s.split('|');return shuf(o.map((t,i)=>({t,ok:i===0})))};
const fmt=s=>{const a=Math.abs(s);return (s<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')};
function goFor(t){
  if(/Part 5/.test(t))return '<button class="go" data-go="p5">在 APP 裡練習</button>';
  if(/Part 7/.test(t))return '<button class="go" data-go="p7">在 APP 裡練習</button>';
  if(t==='單字')return '<button class="go" data-go="vocab">翻單字卡</button>';
  return '';
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){
  stopTimer();
  timerId=setInterval(()=>{if(!Q||Q.done){stopTimer();return}
    const el=document.getElementById('tm');if(!el)return;
    const left=Q.limit-Math.floor((Date.now()-Q.t0)/1000);
    el.textContent=Q.limit?fmt(left):fmt(Math.floor((Date.now()-Q.t0)/1000));
    el.classList.toggle('over',Q.limit&&left<0)},1000);
}
function startP5(retry){
  let ids;
  if(retry)ids=shuf(WRONG.p5).slice(0,30);
  else{const w=new Set(WRONG.p5);const all=shuf(B.p5.map((_,i)=>i));
    ids=all.filter(i=>w.has(i)).slice(0,8).concat(all.filter(i=>!w.has(i))).slice(0,30);ids=shuf(ids)}
  if(!ids.length)return;
  Q={kind:'p5',retry:!!retry,items:ids.map(i=>({i,opts:mkOpts(B.p5[i][1]),pick:-1})),cur:0,t0:Date.now(),limit:retry?0:Math.round(ids.length*18),done:false};
  tab='prac';render();startTimer();
}
function startP7(pi,onlyWrong){
  const P=B.p7[pi];let qs=P.q.map((_,k)=>k);
  if(onlyWrong)qs=qs.filter(k=>WRONG.p7.includes(pi+'-'+k));
  Q={kind:'p7',pi,items:qs.map(k=>({k,opts:mkOpts(P.q[k][1]),pick:-1})),t0:Date.now(),limit:qs.length*60,done:false};
  tab='prac';render();startTimer();window.scrollTo(0,0);
}
function startVocab(){
  const sorted=shuf(VOC.map((v,i)=>i)).sort((a,b)=>(VLV[VOC[a].w]||0)-(VLV[VOC[b].w]||0));
  Q={kind:'vocab',ids:sorted.slice(0,20),cur:0,flip:false,known:0,done:false};
  tab='prac';render();
}
function finish(){
  Q.done=true;Q.sec=Math.floor((Date.now()-Q.t0)/1000);stopTimer();
  let c=0;
  if(Q.kind==='p5'){
    Q.items.forEach(it=>{const ok=it.pick>=0&&it.opts[it.pick].ok;if(ok)c++;
      const has=WRONG.p5.includes(it.i);
      if(!ok&&!has)WRONG.p5.push(it.i);if(ok&&has&&Q.retry)WRONG.p5=WRONG.p5.filter(x=>x!==it.i)});
    if(!Q.retry){P5LOG.push({d:todayStr,c,n:Q.items.length,s:Q.sec});store.set('p5log',P5LOG)}
  }else{
    Q.items.forEach(it=>{const key=Q.pi+'-'+it.k,ok=it.pick>=0&&it.opts[it.pick].ok;if(ok)c++;
      const has=WRONG.p7.includes(key);if(!ok&&!has)WRONG.p7.push(key);if(ok&&has)WRONG.p7=WRONG.p7.filter(x=>x!==key)});
    P7DONE[Q.pi]={c,n:Q.items.length,s:Q.sec};store.set('p7done',P7DONE);
  }
  Q.c=c;store.set('wrong',WRONG);render();window.scrollTo(0,0);
}

  const last=P5LOG.slice(-1)[0],p7n=Object.keys(P7DONE).length,known=VOC.filter(v=>(VLV[v.w]||0)>=2).length,wn=WRONG.p5.length+WRONG.p7.length;
  return `<section>
  <div class="modes">
    <button class="mode" data-act="p5"><b>Part 5 限時</b><span>30 題・9 分鐘，題庫 ${B.p5.length} 題</span><span class="big">${last?last.c+'/'+last.n:'—'}</span><span>${last?'上次用時 '+fmt(last.s):'還沒做過'}</span></button>
    <button class="mode" data-act="p7list"><b>Part 7 閱讀</b><span>每題限時 1 分鐘，${B.p7.length} 篇</span><span class="big">${p7n}/${B.p7.length}</span><span>已完成篇數</span></button>
    <button class="mode" data-act="vocab"><b>單字卡</b><span>每輪 20 張，不熟的優先</span><span class="big">${known}/${VOC.length}</span><span>已熟記</span></button>
    <button class="mode" data-act="wrong"><b>錯題本</b><span>答錯的題目自動收進來</span><span class="big">${wn}</span><span>待訂正</span></button>
  </div>
  ${P5LOG.length?`<div><div class="eyebrow" style="margin-bottom:6px">Part 5 紀錄</div><div class="slist">${P5LOG.slice(-5).reverse().map(l=>`<div class="srow" style="grid-template-columns:1fr auto auto"><span class="mono">${l.d}</span><span class="mono">${l.c}/${l.n}</span><span class="mono ${l.s<=540?'ok':'bad'}">${fmt(l.s)}</span></div>`).join('')}</div></div>`:''}
  <div class="note">題目是依多益題型原創的練習題，用來練速度和題型熟悉度。分數請以《神猜解》全真模考為準。</div></section>`;
}
function renderP7List(){
  return `<section><div class="daybar"><button class="navbtn" data-act="home" aria-label="返回">‹</button><h2>Part 7 閱讀</h2><span style="width:40px"></span></div>
  <div class="rows">${B.p7.map((p,i)=>{const d=P7DONE[i];return `<button class="row" data-p7="${i}" style="grid-template-columns:1fr auto"><span class="s"><b style="font-weight:500">${esc(p.title)}</b><br><small class="muted">${p.t}・${p.q.length} 題・限時 ${p.q.length} 分鐘</small></span><span class="st mono${d&&d.c===d.n?' ok':''}">${d?d.c+'/'+d.n:'未做'}</span></button>`}).join('')}</div></section>`;
}
function renderWrong(){
  const p7=WRONG.p7.map(k=>k.split('-').map(Number));
  const byP=[...new Set(p7.map(x=>x[0]))];
  return `<section><div class="daybar"><button class="navbtn" data-act="home" aria-label="返回">‹</button><h2>錯題本</h2><span style="width:40px"></span></div>
  ${WRONG.p5.length?`<button class="btn" data-act="p5retry">重做 Part 5 錯題（${WRONG.p5.length} 題）</button>`:''}
  ${byP.length?`<div class="rows">${byP.map(pi=>`<button class="row" data-p7w="${pi}" style="grid-template-columns:1fr auto"><span class="s">${esc(B.p7[pi].title)}</span><span class="st mono bad">${p7.filter(x=>x[0]===pi).length} 題</span></button>`).join('')}</div>`:''}
  ${!WRONG.p5.length&&!byP.length?'<div class="note">目前沒有錯題。做完練習後，答錯的題目會自動收進這裡，重做答對就會移除。</div>':''}
  ${WRONG.p5.length?`<div class="slist">${WRONG.p5.map(i=>{const q=B.p5[i];return `<div class="rv"><span class="s">${esc(q[0].replace('___','<u>'+q[1].split('|')[0]+'</u>')).replace(/&lt;(\/?)u&gt;/g,'<$1u>')}</span><span class="exp">${esc(q[2])}｜${esc(q[3])}</span></div>`}).join('')}</div>`:''}
  </section>`;
}
function bar(label){return `<div class="qbar"><button class="navbtn" data-act="quit" aria-label="離開">×</button><span class="muted" style="font-size:13px">${label}</span><span class="timer" id="tm">${Q.limit?fmt(Q.limit-Math.floor((Date.now()-Q.t0)/1000)):fmt(Math.floor((Date.now()-Q.t0)/1000))}</span></div>`}
function renderP5(){
  if(Q.done){
    return `<section><div class="result"><b>${Q.c}/${Q.items.length}</b><span class="muted">用時 <span class="mono ${!Q.limit||Q.sec<=Q.limit?'ok':'bad'}">${fmt(Q.sec)}</span>${Q.limit?'（目標 '+fmt(Q.limit)+'）':''}</span></div>
    <div class="row2"><button class="btn" data-act="${Q.retry?'p5retry':'p5'}">再做一組</button><button class="btn ghost" data-act="home">回練習首頁</button></div>
    <div class="slist">${Q.items.map((it,n)=>{const q=B.p5[it.i],ok=it.pick>=0&&it.opts[it.pick].ok,ans=q[1].split('|')[0];
      return `<div class="rv"><span class="s">${n+1}. ${esc(q[0])}</span><span class="a">${ok?'<span class="ok">✓ '+esc(ans)+'</span>':'<span class="bad">✗ '+(it.pick>=0?esc(it.opts[it.pick].t):'未作答')+'</span>　正解 <b>'+esc(ans)+'</b>'}</span><span class="exp">${esc(q[2])}｜${esc(q[3])}</span></div>`}).join('')}</div></section>`;
  }
  const it=Q.items[Q.cur],q=B.p5[it.i];
  return `<section>${bar((Q.retry?'錯題重做 ':'Part 5 ')+(Q.cur+1)+' / '+Q.items.length)}
  <div class="progress"><i style="width:${Q.cur/Q.items.length*100}%"></i></div>
  <div class="qtext">${esc(q[0]).replace('___','<b>_______</b>')}</div>
  <div class="opts">${it.opts.map((o,k)=>`<button class="opt${it.pick===k?' pick':''}" data-pick="${k}"><span class="bub">${LET[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
  <div class="row2"><button class="btn ghost" data-act="prev" ${Q.cur?'':'disabled'}>上一題</button>${Q.cur<Q.items.length-1?'<button class="btn ghost" data-act="next">跳過</button>':'<button class="btn" data-act="finish">交卷</button>'}</div></section>`;
}
function renderP7(){
  const P=B.p7[Q.pi];
  const qs=Q.items.map((it,n)=>{const q=P.q[it.k];
    return `<div class="qblock"><h4>${n+1}. ${esc(q[0])}</h4><div class="opts">${it.opts.map((o,k)=>{
      let c='';if(Q.done){if(o.ok)c=' right';else if(it.pick===k)c=' wrong'}else if(it.pick===k)c=' pick';
      return `<button class="opt${c}" data-pick7="${n}-${k}" ${Q.done?'disabled':''}><span class="bub">${LET[k]}</span><span>${esc(o.t)}</span></button>`}).join('')}</div>${Q.done?`<span class="exp">${esc(q[2])}</span>`:''}</div>`}).join('');
  return `<section>${Q.done?`<div class="result"><b>${Q.c}/${Q.items.length}</b><span class="muted">用時 <span class="mono ${Q.sec<=Q.limit?'ok':'bad'}">${fmt(Q.sec)}</span>（目標 ${fmt(Q.limit)}）</span></div>`:bar(esc(P.title))}
  <div class="passage">${esc(P.text)}</div>${qs}
  ${Q.done?`<div class="row2"><button class="btn" data-act="p7list">下一篇</button><button class="btn ghost" data-act="home">回練習首頁</button></div>`:'<button class="btn" data-act="finish">交卷</button>'}</section>`;
}
function renderVocab(){
  if(Q.cur>=Q.ids.length)return `<section><div class="result"><b>${Q.known}/${Q.ids.length}</b><span class="muted">這輪認識的字</span></div><div class="row2"><button class="btn" data-act="vocab">再一輪</button><button class="btn ghost" data-act="home">回練習首頁</button></div></section>`;
  const v=VOC[Q.ids[Q.cur]];
  return `<section><div class="qbar"><button class="navbtn" data-act="quit" aria-label="離開">×</button><span class="muted" style="font-size:13px">單字 ${Q.cur+1} / ${Q.ids.length}</span><span class="mono muted" style="font-size:13px">熟練度 ${VLV[v.w]||0}</span></div>
  <div class="card" data-act="flip"><span class="w">${esc(v.w)}</span>${Q.flip?`<span class="m">${esc(v.m)}</span>`:'<span class="muted" style="font-size:13px">點一下看中文</span>'}</div>
  <div class="row2"><button class="btn ghost" data-vk="0">不熟</button><button class="btn" data-vk="1">認識</button></div></section>`;
}
function renderPrac(){
  if(!Q)return pracView==='p7list'?renderP7List():pracView==='wrong'?renderWrong():renderPracHome();
  return Q.kind==='p5'?renderP5():Q.kind==='p7'?renderP7():renderVocab();
}
let pracView='home';
function pracClick(e){
  const a=e.target.closest('[data-act]'),go=e.target.closest('[data-go]');
  if(go){const g=go.dataset.go;g==='p5'?startP5():g==='vocab'?startVocab():(Q=null,pracView='p7list',tab='prac',render());return true}
  const p7=e.target.closest('[data-p7]');if(p7){startP7(+p7.dataset.p7);return true}
  const p7w=e.target.closest('[data-p7w]');if(p7w){startP7(+p7w.dataset.p7w,true);return true}
  const pk=e.target.closest('[data-pick]');if(pk&&Q){const it=Q.items[Q.cur];it.pick=+pk.dataset.pick;
    if(Q.cur<Q.items.length-1){render();setTimeout(()=>{if(Q&&!Q.done){Q.cur++;render()}},180)}else render();return true}
  const pk7=e.target.closest('[data-pick7]');if(pk7&&Q){const[n,k]=pk7.dataset.pick7.split('-').map(Number);Q.items[n].pick=k;
    const y=window.scrollY;render();window.scrollTo(0,y);return true}
  const vk=e.target.closest('[data-vk]');if(vk&&Q){const v=VOC[Q.ids[Q.cur]].w,ok=vk.dataset.vk==='1';
    VLV[v]=Math.max(0,Math.min(3,(VLV[v]||0)+(ok?1:-1)));if(ok)Q.known++;store.set('vocab',VLV);Q.cur++;Q.flip=false;render();return true}
  if(!a)return false;
  const act=a.dataset.act;
  if(act==='p5')startP5();
  else if(act==='p5retry')startP5(true);
  else if(act==='vocab')startVocab();
  else if(act==='flip'){Q.flip=!Q.flip;render()}
  else if(act==='next'){Q.cur++;render()}
  else if(act==='prev'){Q.cur--;render()}
  else if(act==='finish')finish();
  else if(act==='quit'){stopTimer();Q=null;pracView='home';render()}
  else{stopTimer();Q=null;pracView=act==='p7list'?'p7list':act==='wrong'?'wrong':'home';render();window.scrollTo(0,0)}
  return true;
}

function render(){
  header();
  const v=document.getElementById('view');
  v.innerHTML=tab==='today'?renderToday():tab==='plan'?renderPlan():tab==='score'?renderScore():tab==='prac'?renderPrac():renderSet();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

function toggle(i){
  const d=sel||defaultSel(),a=doneOf(d).slice(),k=a.indexOf(i);
  k<0?a.push(i):a.splice(k,1);DONE[d]=a;store.set('done',DONE);render();
}

document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){tab=nb.dataset.tab;confirmReset=false;render();window.scrollTo(0,0);return}
  if(pracClick(e))return;
  const st=e.target.closest('[data-step]');if(st){sel=ymd(add(pd(sel||defaultSel()),+st.dataset.step));render();return}
  const dd=e.target.closest('[data-d]');if(dd){sel=dd.dataset.d;tab='today';render();window.scrollTo(0,0);return}
  const tk=e.target.closest('.task');if(tk){toggle(+tk.dataset.i);return}
  const dl=e.target.closest('[data-del]');if(dl){SCORES=SCORES.filter(s=>s.id!=dl.dataset.del);store.set('scores',SCORES);render();return}
  const of=e.target.closest('[data-off]');if(of){const i=+of.dataset.off;S.off=S.off.includes(i)?S.off.filter(x=>x!==i):S.off.concat(i);of.classList.toggle('on');return}
  if(e.target.id==='reset'){if(confirmReset){DONE={};store.set('done',DONE);confirmReset=false}else confirmReset=true;render()}
});
document.addEventListener('keydown',e=>{const tk=e.target.closest&&e.target.closest('.task');if(tk&&(e.key===' '||e.key==='Enter')){e.preventDefault();toggle(+tk.dataset.i)}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='scForm'){
    const L=+document.getElementById('scL').value,R=+document.getElementById('scR').value;
    if(!(L>=5&&L<=495&&R>=5&&R<=495))return;
    SCORES.push({id:Date.now(),date:document.getElementById('scDate').value||todayStr,label:document.getElementById('scLabel').value||'模考',L,R});
    store.set('scores',SCORES);render();
  }else if(e.target.id==='setForm'){
    S.exam=document.getElementById('sExam').value||S.exam;S.start=document.getElementById('sStart').value||S.start;
    S.target=Math.min(990,Math.max(300,+document.getElementById('sTarget').value||800));S.workMin=Math.max(30,+document.getElementById('sWork').value||90);S.offMin=Math.max(150,+document.getElementById('sOff').value||240);
    store.set('settings',S);sel=null;tab='today';render();
  }
});

render();
try{ if('serviceWorker' in navigator && !/claude|anthropic/.test(location.hostname) && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){}
})();
</script>

</body></html>
