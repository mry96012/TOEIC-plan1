<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多益衝刺">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>多益衝刺計畫</title>
<meta name="theme-color" content="#0E6B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄手機 app，答案卡劃記為視覺母題；底部分頁導覽 */
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#1D2330; --muted:#5D6676; --line:#D6DCE4;
  --accent:#0E6B66; --accent-soft:#DDEFEC; --pencil:#2B2F38;
  --L:#3456A0; --R:#0E6B66; --V:#8A5A1E; --M:#A23838; --ok:#2E7D4F;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141A; --card:#1A1E26; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2A303B;
  --accent:#4DB6AC; --accent-soft:#163330; --pencil:#D9DDE4;
  --L:#8EA9E6; --R:#4DB6AC; --V:#D6A764; --M:#E68A8A; --ok:#6CC592; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141A; --card:#1A1E26; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2A303B;
  --accent:#4DB6AC; --accent-soft:#163330; --pencil:#D9DDE4;
  --L:#8EA9E6; --R:#4DB6AC; --V:#D6A764; --M:#E68A8A; --ok:#6CC592; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p,.td,.exp,.note,.qtext{text-wrap:pretty}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-family:var(--mono);font-size:56px;line-height:1;font-weight:600;color:var(--accent);letter-spacing:-.02em}
.count span{font-size:15px;color:var(--muted)}
.goal{text-align:right;font-size:13px;color:var(--muted)}
.goal .mono{color:var(--ink);font-size:15px}

section{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:max-content}

/* day nav */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar h2{font-size:20px}
.navbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.navbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);cursor:pointer;font:inherit}
.wd small{font-size:11px;color:var(--muted)}
.wd .n{font-family:var(--mono);font-size:14px}
.wd .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.wd .dot.half{background:linear-gradient(90deg,var(--pencil) 50%,transparent 50%)}
.wd .dot.full{background:var(--pencil);border-color:var(--pencil)}
.wd.off .n{color:var(--accent)}
.wd.sel{border-color:var(--accent);background:var(--card)}
.wd.exam .n{color:var(--M);font-weight:600}

/* tasks */
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tasks{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tasks{margin:0;padding:0;list-style:none}
.task{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tbtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%;min-height:56px;padding:14px;text-align:left;font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.tbtn:active{background:var(--accent-soft)}
.tbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.task .go{align-self:flex-start;margin:-6px 0 12px 52px}
.task:first-child{border-top:0}
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:1px;transition:background .15s}
.task.done .bub{background:var(--pencil);border-color:var(--pencil);color:transparent}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:500;min-width:0}
.td{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;margin-right:6px}
.tag.L{color:var(--L)}.tag.R{color:var(--R)}.tag.V{color:var(--V)}.tag.M{color:var(--M)}
.min{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* plan */
.wk{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.wk h3{font-size:16px;display:flex;justify-content:space-between;gap:8px}
.wk p{margin:0;font-size:13px;color:var(--muted)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.row:first-child{border-top:0}
.row .d{font-family:var(--mono);font-size:13px}
.row .d small{display:block;font-family:var(--sans);color:var(--muted);font-size:11px}
.row .s{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.today{background:var(--accent-soft)}
.row .st{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .st.ok{color:var(--ok)}

/* scores */
form.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;min-height:44px}
input[aria-invalid="true"]{border-color:var(--M)}
.err{grid-column:1/-1;margin:0;font-size:13px;color:var(--M)}
.full{grid-column:1/-1}
.btn{font:inherit;font-weight:500;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow .tot{font-family:var(--mono);font-weight:600}
.tot-wrap{display:inline-flex;align-items:center;gap:6px}
.del{position:relative;display:inline-grid;place-items:center;min-width:44px;min-height:44px;margin:-10px -10px -10px 0;background:none;border:0;color:var(--muted);font:inherit;font-size:20px;cursor:pointer}
.del.ask{min-width:auto;font-size:13px;font-weight:500;color:var(--M);padding:0 10px}

/* settings */
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{font:inherit;min-height:44px;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.days7 button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{color:var(--accent)}
/* practice */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-width:0}
.mode b{font-size:16px}
.mode span{font-size:12px;color:var(--muted)}
.mode .big{font-family:var(--mono);font-size:22px;color:var(--accent);font-weight:600}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding-block:10px;z-index:3;border-bottom:1px solid var(--line)}
.timer{font-family:var(--mono);font-size:20px;font-weight:600}
.timer.over{color:var(--M)}
.qtext{font-size:17px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt .bub{margin:0}
.opt.pick{border-color:var(--pencil)}
.opt.pick .bub{background:var(--pencil);border-color:var(--pencil);color:var(--card)}
.opt.right{border-color:var(--ok)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--M)}
.opt.wrong .bub{background:var(--M);border-color:var(--M);color:var(--card)}
.passage{white-space:pre-wrap;font-size:15px;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:Georgia,"Noto Serif TC",serif}
.qblock{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.qblock h4{margin:0;font-size:15px;font-weight:500}
.exp{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--accent-soft);border-radius:10px}
.result{display:flex;align-items:baseline;gap:10px}
.result b{font-family:var(--mono);font-size:44px;color:var(--accent)}
.rv{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.rv .s{font-size:15px}
.rv .a{font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--M)}
.card{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;cursor:pointer;text-align:center}
.card .w{font-size:30px;font-weight:600;font-family:Georgia,serif;word-break:break-word}
.card .m{font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{position:relative;font:inherit;font-size:13px;font-weight:500;color:var(--accent);background:var(--card);border:1px solid var(--accent);border-radius:999px;padding:6px 14px;min-height:32px;cursor:pointer}
.go::after,.del::after{content:"";position:absolute;inset:-8px -4px}
.plist{display:flex;flex-direction:column}
/* listening */
.play{display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:17px;font-weight:600;min-height:64px;border-radius:16px;border:0;background:var(--accent);color:var(--card);cursor:pointer;flex-wrap:wrap;padding:10px 16px}
.play svg{width:26px;height:26px;fill:currentColor}
.play.playing{background:var(--ink)}
.play .i-stop,.play.playing .i-play{display:none}
.play.playing .i-stop{display:block}
.play .cnt{width:100%;text-align:center;font-size:12px;font-weight:400;opacity:.85}
.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt.big{justify-content:center;display:flex;min-height:64px;padding:0}
.opt.big .bub{width:36px;height:36px;font-size:16px}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.script{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.script .en{margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:15px;line-height:1.6}
.script .who{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:8px;vertical-align:2px}
.rate{flex-direction:row;align-items:center;gap:6px;font-size:12px}
.rate select{font-size:15px;padding:6px 8px;width:auto;min-height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <h1 class="sr">多益衝刺計畫</h1>
    <div>
      <div class="eyebrow">距離 <span id="examLbl"></span> 多益</div>
      <div class="count"><b id="cd">0</b><span>天</span></div>
    </div>
    <div class="goal">目標 <span class="mono" id="goalT">800</span><br>最近 <span class="mono" id="latest">675</span><br><span id="gap"></span></div>
  </header>
  <main id="view"></main>
</div>

<nav aria-label="主要分頁"><div class="in">
  <button type="button" data-tab="today" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>今天</button>
  <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>計畫</button>
  <button type="button" data-tab="prac"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>練習</button>
  <button type="button" data-tab="score"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>成績</button>
  <button type="button" data-tab="set"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
</div></nav>

<script>
// 原創多益練習題庫。每題正解寫在選項第一個，程式執行時會打亂順序。
window.BANK = {
p5: [
["The new software will help employees ___ their tasks more efficiently.","complete|completion|completely|completed","詞性","help + 受詞 + 原形動詞，空格要動詞原形。"],
["Ms. Lin has been ___ to the position of regional manager.","promoted|promotion|promoting|promote","被動","has been + p.p. 是現在完成被動，「被升職」。"],
["All visitors must sign in at the front desk ___ entering the laboratory.","before|during|until|since","介係詞","進實驗室「之前」簽到，before + Ving。"],
["The quarterly report was ___ thorough that the board approved it without changes.","so|such|too|very","句型","so + 形容詞 + that…，「如此…以致於」。such 後面接名詞。"],
["Please submit your expense reports ___ Friday at 5 P.M.","by|until|in|at","介係詞","截止期限用 by；until 表示持續到某時。"],
["Our customer service team ___ responds to inquiries within 24 hours.","typically|typical|typify|typicality","詞性","修飾動詞 responds 要用副詞。"],
["The conference room on the third floor is currently ___ renovation.","under|over|below|among","介係詞","under renovation 是固定用法，「整修中」。"],
["Mr. Chen asked his assistant to reschedule the meeting because ___ was traveling.","he|him|his|himself","代名詞","子句主詞位置用主格 he。"],
["The company's profits increased ___ 15 percent last quarter.","by|at|with|for","介係詞","增加「了」多少幅度用 by。"],
["Applicants ___ résumés are incomplete will not be considered.","whose|who|whom|which","關係詞","空格後直接接名詞 résumés，表所有格用 whose。"],
["Neither the manager ___ her assistant was available for comment.","nor|or|and|but","連接詞","neither A nor B 固定搭配。"],
["The shipment is expected to arrive ___ two to three business days.","within|among|between|along","介係詞","within + 時間，「在…之內」。"],
["Ms. Park is the ___ qualified of all the candidates.","most|more|much|many","比較級","the ___ of all 是最高級。"],
["The hotel offers free shuttle service to the airport for all ___ guests.","registered|registering|registers|registration","詞性","修飾 guests，「已登記的」客人用過去分詞。"],
["If the weather ___ good tomorrow, the outdoor event will proceed as planned.","is|will be|was|being","時態","條件句 if 子句用現在式代替未來。"],
["The manager suggested ___ the launch date until the testing is complete.","postponing|to postpone|postpone|postponed","動名詞","suggest + Ving。"],
["We are pleased to announce that our new branch ___ next month.","will open|opened|has opened|opening","時態","next month 是未來時間。"],
["Employees are reminded to turn off all equipment at the end of ___ shift.","their|them|they|theirs","代名詞","名詞 shift 前用所有格 their。"],
["The budget proposal must be approved by the finance department ___ it can be implemented.","before|unless|although|whereas","連接詞","先核准「之後才能」執行，用 before。"],
["Despite the heavy rain, attendance at the trade fair was ___ high.","surprisingly|surprising|surprise|surprised","詞性","修飾形容詞 high 要用副詞。"],
["Tickets for the concert can be purchased online ___ at the box office.","or|nor|so|yet","連接詞","兩個購票管道二選一用 or。"],
["The CEO will deliver a speech ___ the company's 50th anniversary celebration.","at|on|to|by","介係詞","在某場活動上用 at。"],
["Please refer to the attached document for ___ information about the project.","additional|addition|additionally|add","詞性","修飾名詞 information 要用形容詞。"],
["The marketing team has ___ completed the first phase of the campaign.","already|yet|still|ever","副詞","肯定句的現在完成式表「已經」用 already；yet 用於否定或疑問。"],
["Ms. Wong prefers to handle client complaints ___ rather than delegating them.","herself|she|her|hers","代名詞","強調「親自」處理用反身代名詞。"],
["The factory has reduced its energy consumption ___ installing solar panels.","by|for|with|from","介係詞","by + Ving 表「藉由…方式」。"],
["Only employees with security clearance are ___ to enter the server room.","permitted|permission|permitting|permit","被動","be permitted to V，「被允許」。"],
["The new policy will take ___ on January 1.","effect|affect|effective|effectively","字彙","take effect 是固定用法，「生效」。"],
["The seminar has been rescheduled ___ low registration numbers.","due to|because|although|so that","介係詞","空格後是名詞片語，用介係詞 due to；because 後要接子句。"],
["We need to hire someone ___ can speak both English and Japanese.","who|whom|whose|which","關係詞","先行詞是人，關代在子句當主詞用 who。"],
["The contract will expire at the end of the month ___ it is renewed.","unless|if|because|once","連接詞","「除非」續約，否則到期。"],
["Sales of the new model have exceeded ___ expectations.","all|every|each|much","限定詞","複數名詞 expectations 前用 all；every、each 接單數。"],
["The report needs to be ___ before it is sent to the client.","revised|revising|revise|revision","被動","to be + p.p.，報告「被修改」。"],
["Mr. Tanaka has worked for the firm ___ 2015.","since|for|from|during","介係詞","現在完成式 + 時間起點用 since。"],
["The restaurant is known for its ___ service and reasonable prices.","attentive|attention|attend|attentively","詞性","修飾名詞 service 要用形容詞。"],
["Participants should bring a photo ID ___ proof of registration.","as well as|as long as|as soon as|as far as","連接詞","as well as 表「以及」，連接兩個名詞。"],
["The renovation project was completed ahead of ___.","schedule|scheduled|scheduling|schedules","字彙","ahead of schedule 固定用法，「提前」。"],
["Customers who wish to return items must present the original ___.","receipt|recipe|reception|recipient","字彙","退貨要出示收據 receipt。"],
["Our sales figures this year are significantly higher ___ last year's.","than|then|as|from","比較級","比較級 higher + than。"],
["The director was impressed by the ___ of the proposal.","clarity|clear|clearly|clarify","詞性","the ___ of 中間要名詞。"],
["Please make sure that all documents are signed ___ submitting them.","before|prior|until|ago","介係詞","prior 要搭配 to；before + Ving 才完整。"],
["The company is seeking a ___ engineer with at least five years of experience.","qualified|qualify|qualification|qualifying","詞性","修飾 engineer，「有資格的」用 qualified。"],
["Each of the departments ___ required to submit a budget plan.","is|are|be|being","主詞動詞一致","Each of + 複數名詞，動詞用單數。"],
["The new branch manager has made several ___ to the workflow.","improvements|improve|improved|improving","詞性","several 後面接複數名詞。"],
["The client requested that the delivery date ___ moved forward.","be|is|was|will be","假設語氣","request that + 主詞 + (should) 原形動詞。"],
["Mr. Lopez will be out of the office ___ next Wednesday.","until|by|since|within","介係詞","不在辦公室的狀態持續「直到」下週三。"],
["Our online store allows customers to track ___ orders in real time.","their|there|they're|them","代名詞","名詞 orders 前用所有格 their。"],
["The board of directors ___ the merger proposal at yesterday's meeting.","approved|approves|will approve|approving","時態","yesterday 用過去式。"],
["The museum is open to the public every day ___ Mondays.","except|besides|without|beyond","介係詞","「除了週一以外」都開，用 except。besides 是「除此之外還有」。"],
["Ms. Kim was ___ for her outstanding contribution to the project.","recognized|recognition|recognize|recognizable","被動","was + p.p.，「被表揚」。"],
["Please contact the IT department ___ you experience any technical problems.","if|unless|whether|so","連接詞","「如果」遇到問題就聯絡。"],
["The new office building is ___ located near the subway station.","conveniently|convenient|convenience|convene","詞性","修飾過去分詞 located 用副詞。"],
["The proposal was rejected because it was not cost-___.","effective|effect|effectively|efficiency","字彙","cost-effective，「划算的」。"],
["Staff members are encouraged ___ in the annual health checkup.","to participate|participating|participate|participated","不定詞","be encouraged to V。"],
["This product comes with a two-year ___ against manufacturing defects.","warranty|voucher|invoice|refund","字彙","保固用 warranty。"],
["The CEO has decided to ___ the company's headquarters to Singapore.","relocate|relocation|relocating|relocated","詞性","decide to + 原形動詞。"],
["The survey results will be shared with all employees ___ they have been analyzed.","once|unless|whereas|despite","連接詞","once 表「一旦…就」。"],
["Ms. Hsu reviewed the contract ___ before signing it.","carefully|careful|care|carefulness","詞性","修飾動詞 reviewed 用副詞。"],
["Please be ___ that the parking lot will be closed for repairs this weekend.","advised|advice|advising|advisory","被動","Please be advised that… 是公告常見句型。"],
["The marketing director, ___ joined the company last year, has already doubled online sales.","who|which|whom|whose","關係詞","先行詞是人、在子句當主詞，用 who。"],
["The supplier offered a 10 percent discount on orders ___ 500 units.","exceeding|exceeded|exceed|excess","分詞","orders exceeding…，「超過…的訂單」，主動用現在分詞。"],
["The workshop is designed for beginners, so no prior experience is ___.","necessary|necessity|necessarily|necessitate","詞性","be 動詞後接形容詞。"],
["The deadline for the project has been ___ by one week.","extended|extension|extensive|extend","被動","has been + p.p.，期限「被延長」。"],
["Not only did the team finish early, ___ they also stayed under budget.","but|and|or|so","連接詞","not only… but (also)… 固定搭配。"],
["We apologize ___ any inconvenience this delay may cause.","for|of|with|by","介係詞","apologize for + 事情。"],
["The training manual should be read ___ before using the machine.","thoroughly|thorough|thoroughness|through","詞性","修飾動詞 read 用副詞。"],
["Interns will be assigned to different departments ___ to their interests.","according|accordance|accord|accordingly","字彙","according to，「根據」。"],
["The hotel's conference facilities can accommodate ___ 300 people.","up to|as of|in case|so far","片語","up to + 數字，「最多」。"],
["Mr. Davis will ___ the presentation in place of the director.","deliver|deliverance|delivery|delivering","詞性","will + 原形動詞。deliver a presentation 是常見搭配。"],
["The city council is considering a proposal ___ public transportation.","to improve|improve|improved|improvement","不定詞","a proposal to V，「一項…的提案」。"],
["The latest model is lighter and ___ than its predecessor.","faster|fastest|more fast|fast","比較級","與 lighter 並列，後有 than，用比較級 faster。"],
["All employees must complete the safety training ___ the end of the month.","by|until|since|during","介係詞","完成某事的期限用 by。"],
["The CEO's speech was well ___ by the audience.","received|receipt|receiving|receptive","被動","be well received，「廣受好評」。"],
["Mr. Huang could not attend the meeting, ___ he sent his deputy.","so|because|although|unless","連接詞","無法出席「所以」派代理人。"],
["Our firm specializes ___ commercial real estate.","in|on|at|for","介係詞","specialize in，「專精於」。"],
["The software update is ___ for all users and will be installed automatically.","mandatory|voluntary|temporary|partial","字彙","會自動安裝，代表是「強制的」。"],
["The new employee orientation will take place in Room 204, ___ is on the second floor.","which|who|where|what","關係詞","逗號後補充說明 Room 204，在子句當主詞用 which。"],
["Ms. Ito was asked to ___ the new interns during their first week.","supervise|supervision|supervisor|supervisory","詞性","to + 原形動詞。"],
["The store will remain open ___ the renovation.","during|while|when|since","介係詞","空格後是名詞，用介係詞 during；while 後接子句。"],
["Please keep your receipt ___ you need to exchange the item.","in case|even if|as though|rather than","連接詞","in case，「以防萬一」。"],
["The new hires will receive ___ training before they start working with clients.","extensive|extend|extension|extensively","詞性","修飾名詞 training 用形容詞。"],
["Mr. Wang is responsible ___ coordinating the annual sales conference.","for|to|of|with","介係詞","be responsible for，「負責」。"],
["The package was sent ___ express mail to ensure it arrives on time.","by|in|on|at","介係詞","by + 運送方式。"],
["___ the project was difficult, the team completed it on schedule.","Although|Despite|Because|However","連接詞","空格後是完整子句且語意轉折，用 Although；Despite 後接名詞。"],
["Customers can choose ___ standard and express delivery.","between|among|either|both","介係詞","between A and B。"],
["The hiring committee will ___ all applications next week.","review|reviewer|reviewing|reviewed","詞性","will + 原形動詞。"],
["Ms. Lee has been working on the report ___ early this morning.","since|for|from|by","介係詞","現在完成進行式 + 起點時間用 since。"],
["Our new printer is ___ faster than the old one.","considerably|considerable|consider|consideration","詞性","修飾比較級 faster 用副詞。"],
["The client was dissatisfied with the ___ of the final product.","quality|qualify|qualified|qualitative","詞性","the ___ of 中間要名詞。"],
["Anyone ___ in volunteering for the charity event should contact Ms. Ho.","interested|interesting|interest|interestingly","分詞","人「感到有興趣的」用過去分詞 interested。"],
["The manager will announce the results ___ the meeting is over.","as soon as|as well as|so as to|in order to","連接詞","as soon as + 子句，「一…就」。"],
["Production was temporarily ___ due to a power outage.","suspended|suspend|suspension|suspending","被動","was + p.p.，生產「被暫停」。"],
["Please read the instructions ___ before assembling the furniture.","carefully|careful|caring|cares","詞性","修飾動詞 read 用副詞。"],
["The event was a great success, thanks ___ the hard work of our volunteers.","to|for|with|of","介係詞","thanks to，「多虧了」。"],
["Mr. Brown is ___ to retire at the end of this year.","scheduled|schedule|scheduling|schedules","被動","be scheduled to V，「預定要」。"],
["The new advertising campaign has attracted a large number of ___.","customers|customer|customize|custom","名詞單複數","a large number of + 複數名詞。"],
["Each team member is expected to contribute ideas ___ the brainstorming session.","during|while|meanwhile|whereas","介係詞","空格後是名詞片語，用 during。"],
["The financial results were ___ than analysts had predicted.","better|best|good|well","比較級","後有 than，用比較級 better。"],
["Employees ___ wish to attend the seminar must register by Friday.","who|whom|which|whose","關係詞","先行詞是人、在子句當主詞，用 who。"],
["The company plans to expand ___ operations into Southeast Asia.","its|it's|it|itself","代名詞","名詞 operations 前用所有格 its。it's = it is。"],
["Ms. Tsai will be in charge of the project ___ Mr. Liu is on leave.","while|during|despite|unless","連接詞","空格後是完整子句，用 while。"],
["The device is easy to use and requires ___ maintenance.","minimal|minimize|minimally|minimization","詞性","修飾名詞 maintenance 用形容詞 minimal。"],
["The deadline is approaching, so we must work ___ to finish on time.","efficiently|efficient|efficiency|efficiencies","詞性","修飾動詞 work 用副詞。"],
["The store manager ___ the staff for their excellent performance last month.","praised|praises|will praise|praising","時態","last month 用過去式。"],
["By the time the new manager arrives next month, the team ___ the project.", "will have completed|has completed|completed|will complete", "時態", "by the time + 未來的時間點，表示「到那時已經完成」，用未來完成式 will have p.p.。"],
["Mr. Ho ___ for the company since it was founded in 2010.", "has worked|worked|works|is working", "時態", "since + 過去時間點，動作持續到現在，用現在完成式。"],
["The marketing team ___ a meeting when the fire alarm went off.", "was holding|is holding|holds|has held", "時態", "過去某動作（警報響）發生時正在進行的事，用過去進行式。"],
["Ms. Chen ___ the report yesterday afternoon.", "submitted|submits|has submitted|will submit", "時態", "yesterday 是明確的過去時間，用過去式；現在完成式不能接明確過去時間。"],
["Our sales ___ steadily over the past three years.", "have increased|increased|increase|will increase", "時態", "over the past three years 表示從過去持續到現在，用現在完成式。"],
["The shuttle bus to the airport ___ every 30 minutes.", "departs|departed|is departed|departing", "時態", "every 30 minutes 是固定班次、規律的事，用現在簡單式。"],
["The board ___ the proposal at next Monday's meeting.", "will discuss|discussed|has discussed|discussing", "時態", "next Monday 是未來時間，用未來式。"],
["Before joining our firm, Mr. Park ___ as an accountant for ten years.", "had worked|has worked|works|will be working", "時態", "加入公司（過去）之前已經做了十年，用過去完成式 had p.p.。"],
["As soon as the shipment ___, we will notify you by e-mail.", "arrives|will arrive|arrived|arriving", "時態", "時間副詞子句（as soon as、when、before）用現在式代替未來式。"],
["Ms. Lin is not available right now because she ___ with a client.", "is meeting|meets|met|has met", "時態", "right now 表示此刻正在進行，用現在進行式。"],
["The company ___ its new headquarters last year.", "opened|has opened|opens|will open", "時態", "last year 是明確的過去時間，用過去式。"],
["Currently, the IT department ___ the company's security system.", "is upgrading|upgraded|has been upgraded|upgrade", "時態", "currently 表示目前正在進行；部門是執行者，用主動的現在進行式。"],
["When Mr. Wu ___ his presentation, he will answer questions from the audience.", "finishes|will finish|finished|finishing", "時態", "when 引導的時間子句用現在式代替未來式。"],
["The conference ___ in Kaohsiung every year since 2018.", "has been held|is held|was held|will be held", "時態", "since 2018 持續到現在用現在完成式；會議「被舉辦」所以是被動 has been held。"],
["Ms. Lee ___ the documents by the time the client called.", "had prepared|has prepared|prepares|will prepare", "時態", "客戶打來（過去）之前就已經準備好，用過去完成式。"],
["Mr. Tsai ___ at the Tokyo branch for two years when he was promoted.", "had been working|has been working|is working|works", "時態", "升職（過去）之前已經持續工作兩年，用過去完成進行式。"],
["Next week, the CEO ___ our new factory in Tainan.", "will visit|visited|has visited|visiting", "時態", "next week 是未來時間，用未來式。"],
["The number of online orders ___ sharply last quarter.", "rose|rises|has risen|will rise", "時態", "last quarter 是明確的過去時間，用過去式。rise 的過去式是 rose。"],
["The new product line ___ at the trade show next month.", "will be introduced|will introduce|introduced|is introducing", "被動", "產品是「被推出」，加上 next month，用未來被動 will be p.p.。"],
["All employees ___ to attend the safety training on Friday.", "are required|require|requiring|have required", "被動", "員工是「被要求」參加，be required to V。"],
["The meeting room ___ for the board meeting tomorrow.", "has been reserved|has reserved|reserving|reserves", "被動", "會議室是「被預約」，主詞是物，用被動。"],
["The damaged items ___ back to the supplier yesterday.", "were sent|sent|are sending|send", "被動", "物品「被寄回」，yesterday 用過去被動 were p.p.。"],
["The results of the survey ___ to all staff by e-mail next week.", "will be sent|will send|sent|are sending", "被動", "結果「被寄出」，next week 用未來被動。"],
["Ms. Kao ___ as the new head of the design department last week.", "was appointed|appointed|has appointed|appoints", "被動", "她是「被任命」的人，用過去被動 was appointed。"],
["The parking lot is currently ___ resurfaced, so please use the side entrance.", "being|been|be|to be", "被動", "is being p.p. 是現在進行被動，表示「正在被重鋪」。"],
["Applications must ___ before the end of the month.", "be submitted|submit|submitting|have submitting", "被動", "申請表「被繳交」，助動詞後接 be p.p.。"],
["The museum, which ___ in 1925, attracts thousands of visitors every year.", "was built|built|has built|is building", "被動", "博物館「被建造」於 1925 年，用過去被動。"],
["The invoice ___ yet, so the payment has been delayed.", "has not been approved|has not approved|did not approve|is not approving", "被動", "發票「還沒被核准」，yet 搭配現在完成式，被動 has not been p.p.。"],
["Our office supplies ___ by Greenway Office Supplies every month.", "are delivered|deliver|are delivering|delivered", "被動", "用品「被送來」，by 後面是執行者，every month 用現在簡單被動。"],
["The project manager ___ about the delay as soon as it occurred.", "was informed|informed|has informed|informing", "被動", "經理是「被通知」的人，inform 後面沒有受詞，用被動。"],
["Please be aware that the elevators ___ from 9 A.M. to noon on Saturday.", "will be inspected|will inspect|inspected|are inspecting", "被動", "電梯「被檢查」，週六是未來時間，用未來被動。"],
["The training session was ___ by more than 200 employees.", "attended|attending|attend|attendance", "被動", "was + p.p.，課程「被參加」。"],
["The list of approved vendors ___ been updated.", "has|have|are|were", "主詞動詞一致", "真正的主詞是 the list（單數），of approved vendors 只是修飾。"],
["Neither the manager nor the assistants ___ aware of the change.", "were|was|is|has been", "主詞動詞一致", "neither A nor B，動詞跟最靠近的 B 一致；assistants 是複數。"],
["Every employee and visitor ___ required to wear a badge.", "is|are|were|have", "主詞動詞一致", "every A and B 視為單數。"],
["The number of applicants ___ increased this year.", "has|have|are|were", "主詞動詞一致", "the number of（…的數量）是單數；a number of（許多）才是複數。"],
["A number of customers ___ complained about the delay.", "have|has|is|was", "主詞動詞一致", "a number of + 複數名詞 = 許多，動詞用複數。"],
["The information in these reports ___ confidential.", "is|are|were|have been", "主詞動詞一致", "information 是不可數名詞，動詞用單數；in these reports 只是修飾。"],
["Either Mr. Huang or his assistants ___ the visitors at the airport.", "will meet|meets|is meeting|has met", "主詞動詞一致", "either A or B 跟最靠近的 B（assistants，複數）一致；只有 will meet 不受單複數限制。"],
["The employees in the accounting department ___ working overtime this week.", "are|is|was|has", "主詞動詞一致", "主詞是 employees（複數），in the accounting department 只是修飾。"],
["One of the printers on the third floor ___ out of order.", "is|are|were|have been", "主詞動詞一致", "one of + 複數名詞，主詞是 one，動詞用單數。"],
["The news about the merger ___ surprising to many employees.", "was|were|are|have been", "主詞動詞一致", "news 雖然有 s，但是不可數名詞，動詞用單數。"],
["Each of the new interns ___ assigned a mentor.", "has been|have been|are|were", "主詞動詞一致", "each of + 複數名詞，主詞是 each，動詞用單數。"],
["Ten thousand dollars ___ a large amount for a small business to invest.", "is|are|were|have", "主詞動詞一致", "金額、時間、距離當作一個整體時，動詞用單數。"],
["The equipment that we ordered last month ___ not arrived yet.", "has|have|are|were", "主詞動詞一致", "equipment 是不可數名詞，用單數 has。"],
["If we had received the order earlier, we ___ it on time.", "would have shipped|will ship|would ship|had shipped", "假設語氣", "與過去事實相反：If + had p.p.，主句用 would have p.p.。"],
["If I ___ you, I would accept the job offer.", "were|am|be|been", "假設語氣", "與現在事實相反的假設，be 動詞一律用 were。"],
["Had the weather been better, the event ___ outdoors.", "would have been held|will be held|was held|would hold", "假設語氣", "Had + 主詞 + p.p. 是省略 if 的過去假設；活動「被舉辦」，用 would have been p.p.。"],
["It is essential that every participant ___ the form before the workshop.", "complete|completes|completed|completing", "假設語氣", "It is essential/important that + 主詞 + (should) 原形動詞。"],
["Mr. Wu is considering ___ his contract for another year.", "extending|to extend|extend|extended", "動名詞", "consider + Ving。"],
["The company has decided ___ its overseas operations.", "to expand|expanding|expand|expanded", "不定詞", "decide + to V。"],
["We look forward to ___ you at the conference.", "seeing|see|seen|saw", "動名詞", "look forward to 的 to 是介係詞，後面接 Ving。"],
["Ms. Hsu is used to ___ long hours during the busy season.", "working|work|worked|works", "動名詞", "be used to + Ving 表示「習慣於」；used to + V 才是「過去常常」。"]

{t:"Email",title:"Office relocation",text:"To: All Staff\nFrom: Grace Liu, Facilities Manager\nDate: March 3\nSubject: Office relocation\n\nDear colleagues,\n\nAs announced last month, our Taipei office will move to the Xinyi Tower on March 28. The move will take place over the weekend so that business is not interrupted. Please pack the items on your desk into the boxes provided by Wednesday, March 25. Label each box with your name and new desk number, which you will receive from your department head next week.\n\nThe IT team will disconnect all computers on Friday afternoon at 3 P.M. Please save your work and log off before then. Equipment will be set up at the new location by Monday morning.\n\nIf you have any questions, contact me at extension 214.\n\nGrace",
q:[["What is the purpose of the e-mail?","To give instructions about an office move|To announce a new IT policy|To introduce a new facilities manager|To request volunteers for a weekend event","第一句就說辦公室要搬家，後面都是搬家的指示。"],
["By when should employees pack their belongings?","March 25|March 28|Next week|Friday at 3 P.M.","by Wednesday, March 25。"],
["Where will employees get their new desk numbers?","From their department heads|From Grace Liu|From the IT team|From the labels on the boxes","which you will receive from your department head。"],
["What is suggested about the move?","It is scheduled to minimize disruption to business|It has been postponed|It will take a full week|Employees must work on Saturday","over the weekend so that business is not interrupted。"]]},
{t:"Advertisement",title:"Brightline Fitness",text:"Brightline Fitness — Now Open in Zhongshan!\n\nCelebrate our grand opening with a special offer. Sign up for a one-year membership before April 30 and get your first two months free. All members enjoy unlimited access to our gym, swimming pool, and group classes, including yoga and indoor cycling. Personal training sessions are available at an additional cost.\n\nOur facility is open from 6 A.M. to 11 P.M. on weekdays and 8 A.M. to 9 P.M. on weekends. Free parking is available in the building's basement for members.\n\nVisit www.brightlinefit.tw or stop by our front desk to register.",
q:[["What is being advertised?","A new fitness center|A swimming competition|A parking service|A yoga instructor course","Now Open + 會員方案，是新開的健身中心。"],
["What do new members get if they register before April 30?","Two months free|Free personal training|A discount on parking|A free yoga mat","get your first two months free。"],
["What is NOT included in the membership?","Personal training sessions|Use of the pool|Group classes|Parking","Personal training 要 additional cost，另外收費。"],
["When does the facility close on Saturdays?","9 P.M.|11 P.M.|8 P.M.|6 P.M.","週末 8 A.M. to 9 P.M.。"]]},
{t:"Text messages",title:"Client pickup",text:"Kevin Ho (10:12 A.M.)\nHi Mia, the client from Osaka just called. Their flight lands at 2 P.M. instead of 4.\n\nMia Chang (10:14 A.M.)\nThat's earlier than planned. I was going to pick them up after my 1 o'clock meeting.\n\nKevin Ho (10:15 A.M.)\nCan someone else go?\n\nMia Chang (10:17 A.M.)\nI'll ask Daniel. He's free this afternoon.\n\nKevin Ho (10:18 A.M.)\nGreat. Also, the dinner reservation is still at 7, right?\n\nMia Chang (10:19 A.M.)\nYes. I'll send Daniel the details now.",
q:[["What problem does Mr. Ho mention?","The clients are arriving earlier than expected|A flight has been canceled|A meeting has been moved|The restaurant is fully booked","lands at 2 P.M. instead of 4。"],

<script>
(function(){
const WD=['日','一','二','三','四','五','六'];
const DEF={start:'2026-10-19',exam:'2026-11-29',off:[5,6],workMin:90,offMin:240,target:800,pw:19,po:10};
const store={get(k,d){try{const v=localStorage.getItem('toeic.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('toeic.'+k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({},DEF,store.get('settings',{}));
let DONE=store.get('done',{});
let askDel=null;
let SCORES=store.get('scores',[{id:1,date:'2026-10-19',label:'最近一次成績',L:325,R:350}]);

const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const todayStr=ymd(new Date());
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};

const PH=[
 {n:'診斷＋打底',g:'週五做第 1 回模考摸清底細，同時把《怪物講師多益速解》剩下的一半讀完。'},
 {n:'Part 7 提速',g:'Part 5 壓到 9 分鐘內做完，Part 7 練到每題平均 1 分鐘。'},
 {n:'聽力 Part 3/4',g:'練成「先看題目、再聽對話」，並讀完《多益解密》。'},
 {n:'模考循環 I',g:'每週一回全真模考，錯題當週訂正完。閱讀時間分配照模考規則走。'},
 {n:'模考循環 II',g:'最後一回模考。目標是閱讀 75 分鐘內全部作答完，不留空白。'},
 {n:'考前收斂',g:'不學新東西，只看錯題本、維持手感，調整作息。'}
];
const isOff=d=>S.off.includes(pd(d).getDay());
function phaseOf(d){
  const toExam=diff(d,S.exam);
  if(toExam<=6)return 5;
  return Math.max(0,Math.min(4,Math.floor(diff(S.start,d)/7)));
}
function offRank(d){ // 這是本週區塊中的第幾個休假日（0 起算）
  const w=Math.floor(diff(S.start,d)/7),bs=add(pd(S.start),w*7);let r=0;
  for(let i=0;i<7;i++){const x=ymd(add(bs,i));if(x===d)return r;if(isOff(x))r++}
  return r;
}
const T=(tag,t,m,d,fixed)=>({tag,t,m,d,fixed});
const vocab=(m=20)=>T('V','單字',m,'《怪物講師 單字+文法》往下推 1 單元，並複習前兩天的字');

function tasksFor(d){
  const toExam=diff(d,S.exam);
  if(toExam===0)return{type:'考試日',list:[T('M','考試',0,'帶身分證正本與准考證，提早 30 分鐘到考場。閱讀照練習的分配：Part 5 九分鐘、Part 6 八分鐘、其餘全給 Part 7。',true)]};
  if(toExam<0||diff(S.start,d)<0)return null;
  const off=isOff(d),p=phaseOf(d);let L=[];
  if(toExam===1){
    return{type:'休息日',list:[T('R','錯題本',30,'只翻錯題本與 Part 5 文法筆記，不做新題'),T('M','準備',10,'確認考場、交通、身分證、准考證、2B 鉛筆與橡皮擦',true),T('M','早睡',0,'今晚不熬夜，明天腦袋清醒比多讀一小時有用',true)]};
  }
  if(off){
    const r=offRank(d),w=Math.floor(diff(S.start,d)/7);
    if(p===5){
      L=[T('M','閱讀計時重做',75,'拿第 1 回模考的閱讀重做一次，照正式 75 分鐘計時',true),T('R','對答與訂正',45,'錯題寫進錯題本，標出是時間不夠還是看不懂'),vocab(20),T('L','聽力暖身',30,'把模考 Part 3/4 錯題音檔再聽一次')];
    }else if(r===0){
      const n=Math.min(w+1,5);
      L=[T('M',`第 ${n} 回全真模考`,120,'《神猜解 5 回全真模擬試題》。聽力 45 分＋閱讀 75 分一次做完不暫停。閱讀分配：Part 5 九分鐘、Part 6 八分鐘、剩下 58 分鐘給 Part 7',true),
         T('M','對答、記成績',20,'把聽力與閱讀分數記到「成績」頁'),
         T('R','整理錯題',60,'錯題分三類：單字不認識、文法、時間不夠沒做到'),vocab(20)];
    }else{
      L=[vocab(20),T('R','模考錯題重做',60,'昨天的錯題蓋住答案再做一次，說得出理由才算懂'),
         T('R','Part 7 多篇限時',45,'《神猜解多益閱讀》雙篇或三篇 2 組，每組照題數 × 1 分鐘計時'),
         T('L','聽力精聽',45,'模考 Part 3/4 錯的那幾段逐句聽寫，再跟讀 3 遍'),
         p<=2?T('R',p===2?'《多益解密》':'《怪物講師多益速解》',40,p===2?'讀 2 節，把出題邏輯抄進筆記':'讀 2 章，目標本週讀完'):T('R','Part 5 文法弱點',40,'挑錯最多的文法類型，回《單字+文法》對應章節複習')];
    }
  }else{
    const dow=pd(d).getDay();
    if(p===0)L=[vocab(),T('R','《怪物講師多益速解》',40,'讀 1 章（目前 52%），本週讀完'),T('R','Part 5 限時',15,'30 題限時 9 分鐘，對答後抄錯題'),T('L','Part 2',15,'1 回 25 題，錯的重聽到聽懂為止')];
    else if(p===1)L=[vocab(),T('R','Part 5 限時',15,'30 題 9 分鐘，速度比上週快才算過關'),T('R','Part 7 單篇計時',40,'《神猜解多益閱讀》單篇 5 篇，每篇限時「題數 × 1 分鐘」，超時就先猜下一題'),T('R','找原文定位',15,'每題錯的都要在文章裡畫出答案根據的那一句')];
    else if(p===2)L=[vocab(),T('L','Part 3/4 預讀',35,'各 1 組：音檔播指示語時先掃題目與選項，聽完後錯題聽寫'),T('R','《多益解密》',20,'讀 1 節（目前 49%）'),T('R','Part 5 限時',15,'30 題 9 分鐘')];
    else if(p<=4){
      L=dow%2?[vocab(),T('R','Part 5+6 限時',20,'46 題限時 17 分鐘，這是正式考試的時間'),T('R','Part 7 多篇',35,'雙篇或三篇 2 組，計時'),T('R','錯題本',15,'把今天的錯題寫進去')]
             :[vocab(),T('L','Part 3/4',30,'各 1 組，先預讀題目再聽'),T('R','Part 7 單篇',25,'3 篇計時'),T('R','錯題本',15,'翻上週的錯題，能直接說出答案才打勾')];
    }else L=[vocab(15),T('R','錯題本',30,'只看錯題，不做新題'),T('L','跟讀',15,'模考 Part 3/4 挑一段跟讀')];
  }
  const budget=off?S.offMin:S.workMin,base=off?240:90;
  const fixedSum=L.filter(x=>x.fixed).reduce((a,x)=>a+x.m,0);
  const flexSum=L.filter(x=>!x.fixed).reduce((a,x)=>a+x.m,0);
  const f=flexSum?Math.max(.3,(budget-(off?fixedSum:0))/(base-(off?fixedSum:0))):1;
  L=L.map(x=>x.fixed||!x.m?x:Object.assign({},x,{m:Math.max(5,Math.round(x.m*f/5)*5)}));
  return{type:off?'休假日':'上班日',list:L};
}

let tab='today',sel=null;
function defaultSel(){
  if(diff(S.start,todayStr)<0)return S.start;
  if(diff(todayStr,S.exam)<0)return S.exam;
  return todayStr;
}
const doneOf=d=>DONE[d]||[];
function statusOf(d){const t=tasksFor(d);if(!t)return 0;const n=t.list.length,k=doneOf(d).length;return k===0?0:k>=n?2:1}

function header(){
  const e=pd(S.exam);
  document.getElementById('examLbl').textContent=(e.getMonth()+1)+'/'+e.getDate()+'（'+WD[e.getDay()]+'）';
  document.getElementById('cd').textContent=Math.max(0,diff(todayStr,S.exam));
  const last=SCORES.slice().sort((a,b)=>a.date<b.date?-1:1).pop();
  document.getElementById('latest').textContent=last?(last.L+last.R):'—';
  document.getElementById('goalT').textContent=S.target;
  const g=last?S.target-(last.L+last.R):0;document.getElementById('gap').textContent=last?(g>0?'還差 '+g+' 分':'已達標'):'';
}

function renderToday(){
  const d=sel||defaultSel(),t=tasksFor(d),dd=pd(d);
  const bs=add(dd,-dd.getDay());
  let wk='';
  for(let i=0;i<7;i++){const x=ymd(add(bs,i)),st=statusOf(x),inR=tasksFor(x);
    wk+=`<button class="wd${x===d?' sel':''}${isOff(x)?' off':''}${x===S.exam?' exam':''}" data-d="${x}" aria-label="${md(x)}"><small>${WD[i]}</small><span class="n">${add(bs,i).getDate()}</span><span class="dot ${st===2?'full':st===1?'half':''}" style="${inR?'':'visibility:hidden'}"></span></button>`}
  let body='';
  if(!t){body=`<div class="note">這天不在衝刺計畫範圍內（${md(S.start)} 到 ${md(S.exam)}）。</div>`}
  else{
    const dn=doneOf(d),tot=t.list.reduce((a,x)=>a+x.m,0),letters='ABCD';
    const p=phaseOf(d);
    body=`<span class="chip">第 ${Math.min(6,Math.floor(diff(S.start,d)/7)+1)} 週・${PH[p].n}</span>
    <div class="meta"><span>${t.type}${d===todayStr?'・今天':''}</span><span class="mono">${tot?Math.floor(tot/60)+' 小時 '+(tot%60)+' 分':''}</span></div>
    <div class="progress" role="progressbar" aria-label="今日完成度" aria-valuemin="0" aria-valuemax="${t.list.length}" aria-valuenow="${dn.length}"><i style="width:${t.list.length?dn.length/t.list.length*100:0}%"></i></div>
    <ul class="tasks" aria-label="今天的任務">${t.list.map((x,i)=>`<li class="task${dn.includes(i)?' done':''}" data-i="${i}">
      <button class="tbtn" role="checkbox" aria-checked="${dn.includes(i)}">
      <span class="bub" aria-hidden="true">${letters[i%4]}</span>
      <span class="tbody"><span class="tt"><span class="tag ${x.tag}">${{L:'聽力',R:'閱讀',V:'單字',M:'考試'}[x.tag]}</span>${x.t}</span><span class="td">${x.d}</span></span>
      <span class="min">${x.m?x.m+'<span class="sr"> 分鐘</span><span aria-hidden="true">′</span>':''}</span></button>${goFor(x.t)}</li>`).join('')}</ul>
    <div class="note">${PH[p].g}</div>`;
  }
  return `<section><div class="daybar"><button class="navbtn" data-step="-1" aria-label="前一天">‹</button>
    <h2>${dd.getMonth()+1} 月 ${dd.getDate()} 日（${WD[dd.getDay()]}）</h2>
    <button class="navbtn" data-step="1" aria-label="後一天">›</button></div>
    <div class="week">${wk}</div>${body}</section>`;
}

function renderPlan(){
  const days=diff(S.start,S.exam);let groups={};
  for(let i=0;i<=days;i++){const x=ymd(add(pd(S.start),i)),w=Math.min(Math.floor(i/7),5);(groups[w]=groups[w]||[]).push(x)}
  let h=`<section><div class="note">《神猜解》兩本和《怪物講師 單字+文法》目前是試用版。你的書櫃還有 3 個未使用兌換碼，先確認能不能換成完整版，這份計畫的模考與 Part 7 練習都靠這兩本。</div>`;
  Object.keys(groups).forEach(w=>{
    const ds=groups[w],p=phaseOf(ds[0]),k=ds.filter(x=>statusOf(x)===2).length;
    h+=`<div class="wk"><h3><span>第 ${+w+1} 週・${PH[p].n}</span><span class="mono muted" style="font-size:13px">${k}/${ds.length}</span></h3><p>${md(ds[0])}–${md(ds[ds.length-1])}　${PH[p].g}</p>
    <div class="rows">${ds.map(x=>{const t=tasksFor(x),st=statusOf(x),dn=doneOf(x).length;
      return `<button class="row${x===todayStr?' today':''}" data-d="${x}"><span class="d">${md(x)}<small>${WD[pd(x).getDay()]}・${t?t.type:''}</small></span><span class="s">${t?t.list.map(y=>y.t).join('・'):''}</span><span class="st mono${st===2?' ok':''}">${t?dn+'/'+t.list.length:''}</span></button>`}).join('')}</div></div>`});
  return h+'</section>';
}

function renderScore(){
  const s=SCORES.slice().sort((a,b)=>a.date<b.date?-1:1);
  const W=320,H=170,pl=34,pr=10,pt=12,pb=24,lo=Math.min(600,...s.map(x=>x.L+x.R))-20,hi=990;
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const x=i=>s.length<2?(pl+W-pr)/2:pl+(W-pl-pr)*i/(s.length-1);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="成績走勢">`;
  [S.target].forEach(v=>{svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--accent)" stroke-dasharray="3 4" stroke-width="1"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--accent)" font-family="IBM Plex Mono,monospace">${v}</text>`});
  [lo+20>600?null:600,700].filter(Boolean).forEach(v=>{if(v>lo)svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`});
  if(s.length){
    svg+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${s.map((p,i)=>x(i)+','+y(p.L+p.R)).join(' ')}"/>`;
    s.forEach((p,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(p.L+p.R)}" r="${i===s.length-1?4.5:3}" fill="${i===s.length-1?'var(--accent)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.5"/>`;
      svg+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${md(p.date)}</text>`});
  }
  svg+='</svg>';
  const next=SCORES.filter(z=>/模考/.test(z.label)).length+1;
  return `<section><h2 style="font-size:18px">成績走勢</h2><div class="chart">${svg}</div>
  <form class="sc" id="scForm" novalidate>
    <label class="full">名稱<input id="scLabel" value="第 ${Math.min(next,5)} 回模考"></label>
    <label>聽力（5–495）<input id="scL" type="number" inputmode="numeric" min="5" max="495" step="5" required aria-describedby="scErr"></label>
    <label>閱讀（5–495）<input id="scR" type="number" inputmode="numeric" min="5" max="495" step="5" required aria-describedby="scErr"></label>
    <p class="err" id="scErr" aria-live="polite"></p>
    <label class="full">日期<input id="scDate" type="date" value="${todayStr}"></label>
    <button class="btn full" type="submit">記下成績</button>
  </form>
  <div class="slist">${s.slice().reverse().map(p=>`<div class="srow"><span>${esc(p.label)}<br><small class="muted mono">${p.date}</small></span><span class="mono" style="color:var(--L)">L ${p.L}</span><span class="mono" style="color:var(--R)">R ${p.R}</span><span class="tot-wrap"><span class="tot">${p.L+p.R}</span>${askDel===p.id?`<button class="del ask" data-del="${p.id}" aria-label="確認刪除 ${esc(p.label)}">確認刪除</button>`:`<button class="del" data-ask="${p.id}" aria-label="刪除 ${esc(p.label)}">×</button>`}</span></div>`).join('')}</div>
  <p class="muted" style="font-size:13px;margin:0">模考分數用書上附的換算表換成 5–495 分再填。要到 ${S.target}，大約需要聽力 ${Math.min(495,Math.round(S.target/2/5)*5+10)}、閱讀 ${S.target-Math.min(495,Math.round(S.target/2/5)*5+10)}。</p></section>`;
}

const VAPID='BL2nHqgCqr-NU9CuEKMey_kbUSPpD1hu7KbNnDLoXF3kZHO9ckOAPGQI_94WGpa-J3nvWQ3HMfJx6imzlBORqHs';
const FB={project:'toeic-plan',key:'AIzaSyDT8hpNyrgt_ZKtx8O7gJ6I0EfoNnPsxqw'};
let PUSHID=store.get('pushid','');
const hrs=v=>Array.from({length:17},(_,i)=>i+6).map(h=>`<option value="${h}"${h==v?' selected':''}>${h}:00</option>`).join('');
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function pushMsg(t){const el=document.getElementById('pushMsg');if(el)el.textContent=t}
function fsVal(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(Array.isArray(v))return{arrayValue:{values:v.map(fsVal)}};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='object')return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fsVal(x)]))}};
  return{stringValue:String(v)};
}
async function syncPush(subJson){
  if(!PUSHID)return false;
  try{
    if(!subJson){const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)return false;subJson=sub.toJSON()}
    const doc={sub:subJson,s:{start:S.start,exam:S.exam,off:S.off,workMin:S.workMin,offMin:S.offMin,pw:S.pw,po:S.po},updatedAt:new Date().toISOString()};
    const url=`https://firestore.googleapis.com/v1/projects/${FB.project}/databases/(default)/documents/toeic_push/${PUSHID}?key=${FB.key}`;
    const r=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:fsVal(doc).mapValue.fields})});
    return r.ok;
  }catch(e){return false}
}
async function enablePush(){
  S.pw=+document.getElementById('pw').value;S.po=+document.getElementById('po').value;store.set('settings',S);
  const standalone=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    pushMsg(standalone?'這台裝置不支援網頁推播，請確認 iOS 已更新到 16.4 以上。':'請先用 Safari 打開網站，點「分享 → 加入主畫面」，再從主畫面的圖示打開 APP 開啟提醒。');return}
  try{
    pushMsg('設定中…');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushMsg('通知權限沒有開啟。可到 iPhone「設定 → 通知」找到這個 APP 打開。');return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    if(!PUSHID){PUSHID=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');store.set('pushid',PUSHID)}
    const ok=await syncPush(sub.toJSON());
    render();pushMsg(ok?'提醒已開啟並同步完成。之後修改時間或休假日都會自動更新。':'通知已開啟，但同步失敗。請確認網路後按「重新同步提醒」。');
  }catch(e){pushMsg('開啟失敗：'+(e&&e.message||e))}
}

const L2=B.l2||[],L3=B.l3||[];

const TTS={ok:!!window.speechSynthesis&&typeof window.SpeechSynthesisUtterance==='function',rate:+store.get('rate',0.95),voices:[],run:0,keep:null};
function loadVoices(){if(!TTS.ok)return;try{TTS.voices=(speechSynthesis.getVoices()||[]).filter(x=>/^en[-_]/i.test(x.lang))}catch(e){}}
if(TTS.ok){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const FEM=/samantha|karen|moira|tessa|serena|victoria|allison|ava|susan|zira|female|fiona|kate|martha|catherine|nicky|kathy/i;
const MAL=/daniel|alex|fred|aaron|arthur|oliver|rishi|gordon|david|mark|james|reed|tom|lee|\bmale\b/i;
function voiceFor(who){
  const v=TTS.voices;if(!v.length)return null;
  const us=l=>l.find(x=>/en[-_]US/i.test(x.lang))||l[0];
  if(who==='N')return us(v.filter(x=>/en[-_](GB|AU)/i.test(x.lang)))||us(v);
  const pool=who==='M'?v.filter(x=>MAL.test(x.name)&&!FEM.test(x.name)):v.filter(x=>FEM.test(x.name));
  return us(pool)||us(v);
}
function setPlaying(on){const b=document.getElementById('playBtn');if(!b)return;b.classList.toggle('playing',on);b.setAttribute('aria-pressed',on?'true':'false');const t=b.querySelector('.pl');if(t)t.textContent=on?'停止':(Q&&Q.plays?'再聽一次':'播放')}
function stopSpeech(){TTS.run++;if(TTS.ok){try{speechSynthesis.cancel()}catch(e){}}setPlaying(false)}
function speak(lines){
  if(!TTS.ok)return Promise.resolve(false);
  stopSpeech();const run=TTS.run;setPlaying(true);
  const same=voiceFor('M')===voiceFor('W');
  return new Promise(res=>{let i=0;
    const next=()=>{
      if(run!==TTS.run)return res(false);
      if(i>=lines.length){setPlaying(false);return res(true)}
      const l=lines[i++],u=new SpeechSynthesisUtterance(l.t),v=voiceFor(l.who||'W');
      u.lang=v?v.lang:'en-US';if(v)u.voice=v;
      u.pitch=same&&l.who==='M'?0.8:same&&l.who==='W'?1.15:1;u.rate=TTS.rate;
      u.onend=()=>setTimeout(next,l.gap==null?400:l.gap);u.onerror=()=>setTimeout(next,60);
      TTS.keep=u;speechSynthesis.speak(u);
    };next();});
}

function playCur(){
  if(!Q)return;
  if(document.getElementById('playBtn')&&document.getElementById('playBtn').classList.contains('playing')){stopSpeech();return}
  Q.plays++;
  let lines;
  if(Q.kind==='l2'){const it=Q.items[Q.cur],q=L2[it.i],rv=it.qv==='W'?'M':'W';
    lines=[{t:q[0],who:it.qv,gap:1000}].concat(it.opts.map((o,k)=>({t:LET[k]+'. '+o.t,who:rv,gap:800})));}
  else lines=L3[Q.si].lines.map(([who,t])=>({t,who,gap:350}));
  speak(lines).then(()=>{const c=document.getElementById('plays');if(c)c.textContent=Q.plays})
}
function finishL(){
  stopSpeech();Q.done=true;let c=0;
  if(Q.kind==='l2'){
    Q.items.forEach(it=>{const ok=it.pick>=0&&it.opts[it.pick].ok;if(ok)c++;const has=WRONG.l2.includes(it.i);
      if(!ok&&!has)WRONG.l2.push(it.i);if(ok&&has)WRONG.l2=WRONG.l2.filter(x=>x!==it.i)});
    if(!Q.retry){L2LOG.push({d:todayStr,c,n:Q.items.length});store.set('l2log',L2LOG)}
  }else{
    Q.items.forEach(it=>{const key=Q.si+'-'+it.k,ok=it.pick>=0&&it.opts[it.pick].ok;if(ok)c++;const has=WRONG.l3.includes(key);
      if(!ok&&!has)WRONG.l3.push(key);if(ok&&has)WRONG.l3=WRONG.l3.filter(x=>x!==key)});
    L3DONE[Q.si]={c,n:Q.items.length,p:Q.plays};store.set('l3done',L3DONE);
  }
  Q.c=c;store.set('wrong',WRONG);render();window.scrollTo(0,0);
}
const who=w=>w==='M'?'男':w==='W'?'女':'廣播';
function renderL2(){
  if(Q.done){
    return `<section><div class="result"><b>${Q.c}/${Q.items.length}</b><span class="muted">Part 2 應答</span></div>
    <div class="row2"><button class="btn" data-act="${Q.retry?'l2retry':'l2'}">再做一組</button><button class="btn ghost" data-act="home">回練習首頁</button></div>
    <div class="slist">${Q.items.map((it,n)=>{const q=L2[it.i],ok=it.pick>=0&&it.opts[it.pick].ok;
      return `<div class="rv"><span class="s">${n+1}. ${esc(q[0])}</span><span class="a">${ok?'<span class="ok">✓ '+esc(q[1])+'</span>':'<span class="bad">✗ '+(it.pick>=0?esc(it.opts[it.pick].t):'未作答')+'</span>　正解 <b>'+esc(q[1])+'</b>'}</span><span class="exp">${esc(q[4])}</span></div>`}).join('')}</div></section>`;
  }
  const it=Q.items[Q.cur],q=L2[it.i],ans=it.pick>=0;
  return `<section><div class="qbar"><button class="navbtn" data-act="quit" aria-label="離開練習">×</button><span class="muted" style="font-size:13px">${Q.retry?'錯題重做 ':'Part 2 '}${Q.cur+1} / ${Q.items.length}</span>${rateCtl()}</div>
  <div class="progress" role="progressbar" aria-label="答題進度" aria-valuemin="0" aria-valuemax="${Q.items.length}" aria-valuenow="${Q.cur}"><i style="width:${Q.cur/Q.items.length*100}%"></i></div>
  <p class="muted" style="margin:0;font-size:14px">聽一句問句和三個回應，選出最合適的回應。題目不顯示文字，跟正式考試一樣。</p>
  ${playBtn()}
  <div class="abc" role="group" aria-label="選擇答案">${it.opts.map((o,k)=>{let c='';if(ans){if(o.ok)c=' right';else if(it.pick===k)c=' wrong'}
    return `<button class="opt big${c}" data-pickl2="${k}" ${ans?'disabled':''} aria-label="選項 ${LET[k]}"><span class="bub">${LET[k]}</span></button>`}).join('')}</div>
  ${ans?`<div class="script" aria-live="polite"><p class="${it.opts[it.pick].ok?'ok':'bad'}" style="margin:0;font-weight:500">${it.opts[it.pick].ok?'答對了':'答錯了，正解是 '+LET[it.opts.findIndex(o=>o.ok)]}</p>
    <p class="en">${esc(q[0])}</p>${it.opts.map((o,k)=>`<p class="en${o.ok?' ok':''}">${LET[k]}. ${esc(o.t)}</p>`).join('')}<span class="exp">${esc(q[4])}</span></div>
    <button class="btn" data-act="l2next">${Q.cur<Q.items.length-1?'下一題':'看結果'}</button>`:''}</section>`;
}
function renderL3(){
  const S3=L3[Q.si];
  const qs=Q.items.map((it,n)=>{const q=S3.q[it.k];
    return `<div class="qblock"><h4>${n+1}. ${esc(q[0])}</h4><div class="opts">${it.opts.map((o,k)=>{
      let c='';if(Q.done){if(o.ok)c=' right';else if(it.pick===k)c=' wrong'}else if(it.pick===k)c=' pick';
      return `<button class="opt${c}" data-pickl3="${n}-${k}" ${Q.done?'disabled':''}><span class="bub">${LET[k]}</span><span>${esc(o.t)}</span></button>`}).join('')}</div>${Q.done?`<span class="exp">${esc(q[2])}</span>`:''}</div>`}).join('');
  const head=Q.done?`<div class="result"><b>${Q.c}/${Q.items.length}</b><span class="muted">聽了 ${Q.plays} 次${Q.plays>1?'（正式考試只播一次）':''}</span></div>`
    :`<div class="qbar"><button class="navbtn" data-act="quit" aria-label="離開練習">×</button><span class="muted" style="font-size:13px">${S3.t}・${esc(S3.title)}</span>${rateCtl()}</div>
      <p class="muted" style="margin:0;font-size:14px">先花 10 秒看完題目和選項，再按播放。正式考試只播一次，盡量聽一次就作答。</p>`;
  return `<section>${head}${playBtn(Q.done?'':`<span class="cnt">已播放 <b id="plays">${Q.plays}</b> 次</span>`)}${qs}
  ${Q.done?`<div class="script"><div class="eyebrow">逐字稿</div>${S3.lines.map(([w,t])=>`<p class="en"><b class="who">${who(w)}</b>${esc(t)}</p>`).join('')}</div>
    <div class="row2"><button class="btn" data-act="l3list">下一組</button><button class="btn ghost" data-act="home">回練習首頁</button></div>`:'<button class="btn" data-act="finish">交卷</button>'}</section>`;
}
function renderL3List(){
  return `<section><div class="daybar"><button class="navbtn" data-act="home" aria-label="返回練習首頁">‹</button><h2>Part 3/4 聽力</h2><span style="width:44px"></span></div>
  <div class="rows">${L3.map((s,i)=>{const d=L3DONE[i];return `<button class="row" data-l3="${i}" style="grid-template-columns:1fr auto"><span class="s"><b style="font-weight:500">${esc(s.title)}</b><br><small class="muted">${s.t}・${s.t==='Part 3'?'對話':'短講'}・${s.q.length} 題</small></span><span class="st mono${d&&d.c===d.n?' ok':''}">${d?d.c+'/'+d.n:'未做'}</span></button>`}).join('')}</div></section>`;
}

function renderPrac(){
  if(!Q)return pracView==='p7list'?renderP7List():pracView==='l3list'?renderL3List():pracView==='wrong'?renderWrong():renderPracHome();
  return Q.kind==='p5'?renderP5():Q.kind==='p7'?renderP7():Q.kind==='l2'?renderL2():Q.kind==='l3'?renderL3():renderVocab();
}
let pracView='home';
function pracClick(e){
  const a=e.target.closest('[data-act]'),go=e.target.closest('[data-go]');
  if(go){const g=go.dataset.go;stopSpeech();g==='p5'?startP5():g==='vocab'?startVocab():g==='l2'?startL2():(Q=null,pracView=g==='l3'?'l3list':'p7list',tab='prac',render(),window.scrollTo(0,0));return true}
  const l3=e.target.closest('[data-l3]');if(l3){startL3(+l3.dataset.l3);return true}
  const l3w=e.target.closest('[data-l3w]');if(l3w){startL3(+l3w.dataset.l3w,true);return true}
  const pl2=e.target.closest('[data-pickl2]');if(pl2&&Q&&Q.kind==='l2'){const it=Q.items[Q.cur];if(it.pick<0){it.pick=+pl2.dataset.pickl2;stopSpeech();render()}return true}
  const pl3=e.target.closest('[data-pickl3]');if(pl3&&Q){const[n,k]=pl3.dataset.pickl3.split('-').map(Number);Q.items[n].pick=k;const y=window.scrollY;render();window.scrollTo(0,y);return true}
  const p7=e.target.closest('[data-p7]');if(p7){startP7(+p7.dataset.p7);return true}
  const p7w=e.target.closest('[data-p7w]');if(p7w){startP7(+p7w.dataset.p7w,true);return true}
  const pk=e.target.closest('[data-pick]');if(pk&&Q){const it=Q.items[Q.cur];it.pick=+pk.dataset.pick;
    if(Q.cur<Q.items.length-1){render();setTimeout(()=>{if(Q&&!Q.done){Q.cur++;render()}},180)}else render();return true}
  const pk7=e.target.closest('[data-pick7]');if(pk7&&Q){const[n,k]=pk7.dataset.pick7.split('-').map(Number);Q.items[n].pick=k;
    const y=window.scrollY;render();window.scrollTo(0,y);return true}
  const vk=e.target.closest('[data-vk]');if(vk&&Q){const v=VOC[Q.ids[Q.cur]].w,ok=vk.dataset.vk==='1';
    VLV[v]=Math.max(0,Math.min(3,(VLV[v]||0)+(ok?1:-1)));if(ok)Q.known++;store.set('vocab',VLV);Q.cur++;Q.flip=false;render();return true}
  if(!a)return false;
  const act=a.dataset.act;
  if(act==='play'){playCur();return true}
  if(act==='l2next'){if(Q.cur<Q.items.length-1){Q.cur++;Q.plays=0;render();playCur()}else finishL();return true}
  stopSpeech();
  if(act==='l2')startL2();
  else if(act==='l2retry')startL2(true);
  else if(act==='p5')startP5();
  else if(act==='p5retry')startP5(true);
  else if(act==='vocab')startVocab();
  else if(act==='flip'){Q.flip=!Q.flip;render()}
  else if(act==='next'){Q.cur++;render()}
  else if(act==='prev'){Q.cur--;render()}
  else if(act==='finish')finish();
  else if(act==='quit'){stopTimer();Q=null;pracView='home';render()}
  else{stopTimer();Q=null;pracView=act==='p7list'?'p7list':act==='l3list'?'l3list':act==='wrong'?'wrong':'home';render();window.scrollTo(0,0)}
  return true;
}

function render(){
  header();
  const v=document.getElementById('view');
  v.innerHTML=tab==='today'?renderToday():tab==='plan'?renderPlan():tab==='score'?renderScore():tab==='prac'?renderPrac():renderSet();
  document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
}

function toggle(i){
  const d=sel||defaultSel(),a=doneOf(d).slice(),k=a.indexOf(i);
  k<0?a.push(i):a.splice(k,1);DONE[d]=a;store.set('done',DONE);render();
}

document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){stopSpeech();tab=nb.dataset.tab;confirmReset=false;render();window.scrollTo(0,0);return}
  if(pracClick(e))return;
  const st=e.target.closest('[data-step]');if(st){sel=ymd(add(pd(sel||defaultSel()),+st.dataset.step));render();return}
  const dd=e.target.closest('[data-d]');if(dd){sel=dd.dataset.d;tab='today';render();window.scrollTo(0,0);return}
  const tb=e.target.closest('.tbtn');if(tb){const i=+tb.closest('.task').dataset.i;toggle(i);const f=document.querySelector(`.task[data-i="${i}"] .tbtn`);if(f)f.focus({preventScroll:true});return}
  const ak=e.target.closest('[data-ask]');if(ak){askDel=+ak.dataset.ask;render();const c=document.querySelector(`[data-del="${askDel}"]`);if(c)c.focus();return}
  const dl=e.target.closest('[data-del]');if(dl){SCORES=SCORES.filter(s=>s.id!=dl.dataset.del);askDel=null;store.set('scores',SCORES);render();return}
  if(askDel!==null&&!e.target.closest('.del')){askDel=null;if(tab==='score'){render()}}
  const of=e.target.closest('[data-off]');if(of){const i=+of.dataset.off;S.off=S.off.includes(i)?S.off.filter(x=>x!==i):S.off.concat(i);of.classList.toggle('on');return}
  if(e.target.id==='pushOn'){enablePush();return}
  if(e.target.id==='reset'){if(confirmReset){DONE={};store.set('done',DONE);confirmReset=false}else confirmReset=true;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='rate'){TTS.rate=+e.target.value;store.set('rate',TTS.rate);return}if(e.target.id==='pw'||e.target.id==='po'){S[e.target.id]=+e.target.value;store.set('settings',S);if(PUSHID)syncPush().then(ok=>pushMsg(ok?'已同步新的提醒時間。':'同步失敗，請稍後按「重新同步提醒」。'))}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='scForm'){
    const L=+document.getElementById('scL').value,R=+document.getElementById('scR').value;
    const okL=L>=5&&L<=495,okR=R>=5&&R<=495;
    document.getElementById('scL').setAttribute('aria-invalid',okL?'false':'true');document.getElementById('scR').setAttribute('aria-invalid',okR?'false':'true');
    if(!okL||!okR){document.getElementById('scErr').textContent=(!okL&&!okR?'聽力和閱讀':!okL?'聽力':'閱讀')+'分數要在 5 到 495 之間。請先用書上的換算表換算再填。';(okL?document.getElementById('scR'):document.getElementById('scL')).focus();return}
    SCORES.push({id:Date.now(),date:document.getElementById('scDate').value||todayStr,label:document.getElementById('scLabel').value||'模考',L,R});
    store.set('scores',SCORES);render();
  }else if(e.target.id==='setForm'){
    S.exam=document.getElementById('sExam').value||S.exam;S.start=document.getElementById('sStart').value||S.start;
    S.target=Math.min(990,Math.max(300,+document.getElementById('sTarget').value||800));S.workMin=Math.max(30,+document.getElementById('sWork').value||90);S.offMin=Math.max(150,+document.getElementById('sOff').value||240);
    store.set('settings',S);sel=null;tab='today';render();syncPush();
  }
});

render();
try{ if('serviceWorker' in navigator && !/claude|anthropic/.test(location.hostname) && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){}
})();
</script>
